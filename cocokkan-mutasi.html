<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://www.gstatic.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#034543">
  <title>Cocokkan Mutasi — Harmoni</title>
  <link rel="stylesheet" href="css/style.css?v=20261103b">
  <style>
    .cm-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
    .cm-bar .form-group { margin:0; }
    .cm-bar select, .cm-bar input { width:auto; font-size:13px; }
    .cm-kartu { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; }
    .cm-k { background:#fff; border:1px solid rgba(3,69,67,.08); border-radius:12px; padding:12px 14px; }
    .cm-k .l { font-size:10px; font-weight:700; letter-spacing:.05em; color:rgba(3,69,67,.5); text-transform:uppercase; }
    .cm-k .v { font-size:18px; font-weight:800; margin-top:4px; }
    table.cm { width:100%; border-collapse:collapse; font-size:12.5px; }
    table.cm th { text-align:left; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:rgba(3,69,67,.5); padding:7px; border-bottom:1px solid rgba(3,69,67,.1); white-space:nowrap; }
    table.cm td { padding:7px; border-bottom:1px solid rgba(3,69,67,.06); vertical-align:top; }
    table.cm td.r, table.cm th.r { text-align:right; white-space:nowrap; }
    .cm-wrap { overflow-x:auto; max-height:420px; overflow-y:auto; }
    .tab { border:1.5px solid rgba(3,69,67,.15); background:#fff; border-radius:999px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; }
    .tab.on { background:var(--green); color:#fff; border-color:var(--green); }
  </style>
</head>
<body>
<div class="layout">
  <nav id="sidebar"></nav>
  <main class="main">
    <div style="margin-bottom:16px">
      <p style="font-size:11px;color:var(--green);opacity:.4;letter-spacing:.06em;margin-bottom:4px">KEUANGAN</p>
      <h1 style="font-size:24px;font-weight:800;letter-spacing:-.025em;color:var(--black)">Cocokkan Mutasi Rekening</h1>
      <p style="font-size:12px;color:rgba(3,69,67,.45);margin-top:3px">Upload file mutasi/rekening koran (CSV atau Excel dari internet/m-banking). Aplikasi mencocokkan uang masuk dengan pembayaran transfer yang dicatat CS — jumlah sama, tanggal selisih maks. 3 hari.</p>
    </div>
    <div class="card">
      <div class="cm-bar">
        <div class="form-group"><label>Rekening</label><select id="rek"></select></div>
        <div class="form-group"><label>Bulan pembayaran</label><input type="month" id="bulan"></div>
        <div class="form-group"><label>File mutasi (.csv / .xlsx)</label><input type="file" id="file" accept=".csv,.xls,.xlsx,text/csv"></div>
      </div>
      <div id="peta" style="display:none">
        <p style="font-size:12px;color:rgba(3,69,67,.6);margin:6px 0">Kolom terdeteksi otomatis — ubah kalau salah:</p>
        <div class="cm-bar">
          <div class="form-group"><label>Tanggal</label><select id="kTgl"></select></div>
          <div class="form-group"><label>Keterangan</label><select id="kKet"></select></div>
          <div class="form-group"><label>Uang masuk (kredit)</label><select id="kKredit"></select></div>
          <div class="form-group"><label>Baris judul</label><input type="number" id="kHeader" min="0" style="width:80px"></div>
          <button class="btn btn-primary btn-sm" onclick="cocokkan()">🔍 Cocokkan</button>
        </div>
        <div id="contoh" style="font-size:11px;color:rgba(3,69,67,.55)"></div>
      </div>
    </div>
    <div id="hasil"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
  import { db } from './js/config.js'
  import { requireAuth, dataAuthReady } from './js/auth.js'
  import { collection, getDocs, getDoc, doc, where, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'
  import { DIVISION_META } from './js/utils.js'

  const rp = n => (n < 0 ? '−Rp' : 'Rp') + Math.abs(Math.round(Number(n) || 0)).toLocaleString('id-ID')
  const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  let banks = [], grid = [], hasil = null, tab = 'beda'

  requireAuth(async p => {
    if (p.role !== 'owner') { location.href = 'dashboard.html'; return }
    await dataAuthReady
    const s = await getDoc(doc(db, 'settings', 'payment_info'))
    banks = (s.exists() ? s.data().banks || [] : []).filter(b => b.accountNumber)
    document.getElementById('rek').innerHTML = banks.map((b, i) => `<option value="${i}">${esc(b.bankName)} ${esc(b.accountNumber)} — ${esc(b.accountHolder || '')}</option>`).join('')
    const now = new Date(); document.getElementById('bulan').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`
    document.getElementById('file').addEventListener('change', bacaFile)
  })

  // ── Baca file & tebak kolom ──
  async function bacaFile(e) {
    const f = e.target.files[0]; if (!f) return
    const buf = await f.arrayBuffer()
    // CSV dibaca sebagai teks apa adanya (supaya 06/11 tidak dianggap format Amerika = 11 Juni)
    const csv = /\.csv$/i.test(f.name) || f.type === 'text/csv'
    const wb = XLSX.read(buf, csv ? { type: 'array', raw: true } : { type: 'array', cellDates: true })
    grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true })
    // Baris judul = baris pertama yang punya ≥3 sel teks & ada kata tanggal/keterangan/kredit/mutasi
    let h = grid.findIndex(r => r.filter(c => String(c).trim()).length >= 3 && /tanggal|tgl|date|keterangan|uraian|description|kredit|credit|mutasi|amount|nominal/i.test(r.join(' ')))
    if (h < 0) h = 0
    document.getElementById('kHeader').value = h
    isiKolom(h)
    document.getElementById('kHeader').onchange = () => isiKolom(Number(document.getElementById('kHeader').value) || 0)
    document.getElementById('peta').style.display = ''
  }
  function isiKolom(h) {
    const judul = (grid[h] || []).map((c, i) => String(c || `Kolom ${i + 1}`).trim())
    const opsi = judul.map((t, i) => `<option value="${i}">${esc(t)}</option>`).join('')
    ;['kTgl', 'kKet', 'kKredit'].forEach(id => { document.getElementById(id).innerHTML = opsi })
    const cari = re => judul.findIndex(t => re.test(t))
    const iT = cari(/tanggal|tgl|date/i), iK = cari(/keterangan|uraian|description|deskripsi|remark/i)
    let iC = cari(/kredit|credit|\bcr\b|masuk/i); if (iC < 0) iC = cari(/mutasi|amount|nominal|jumlah/i)
    if (iT >= 0) document.getElementById('kTgl').value = iT
    if (iK >= 0) document.getElementById('kKet').value = iK
    if (iC >= 0) document.getElementById('kKredit').value = iC
    const contoh = grid.slice(h + 1, h + 4).map(r => r.filter(c => String(c).trim()).slice(0, 6).join(' | ')).join('<br>')
    document.getElementById('contoh').innerHTML = 'Contoh baris: <br>' + esc(contoh).replace(/&lt;br&gt;/g, '<br>')
  }

  const pad = n => String(n).padStart(2, '0')
  function keTanggal(v) {
    if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`
    if (typeof v === 'number' && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}` }
    const s = String(v || '').trim(); if (!s) return ''
    let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})(?:[-/.](\d{2,4}))?/)
    if (m) { const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : document.getElementById('bulan').value.slice(0, 4); return `${y}-${pad(m[2])}-${pad(m[1])}` }
    const BLN = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, aug: 8, ags: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 }
    m = s.match(/^(\d{1,2})[\s-]([a-z]{3})[a-z]*[\s-](\d{2,4})/i)
    if (m && BLN[m[2].toLowerCase()]) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(BLN[m[2].toLowerCase()])}-${pad(m[1])}` }
    return ''
  }
  // "1.234.567,00" / "1,234,567.00" / "500000.00 CR" → angka; kolom berisi DB/debit → negatif
  function keAngka(v) {
    if (typeof v === 'number') return v
    let s = String(v || '').trim(); if (!s) return 0
    const debit = /\b(DB|D|DEBIT)\b/i.test(s) || /^-/.test(s)
    s = s.replace(/[^\d.,]/g, '')
    if (/,\d{2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.')
    else if (/\.\d{2}$/.test(s)) s = s.replace(/,/g, '')
    else s = s.replace(/[.,]/g, '')
    const n = parseFloat(s) || 0
    return debit ? -n : n
  }
  const selisihHari = (a, b) => Math.abs((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5)

  window.cocokkan = async () => {
    const h = Number(document.getElementById('kHeader').value) || 0
    const iT = +document.getElementById('kTgl').value, iK = +document.getElementById('kKet').value, iC = +document.getElementById('kKredit').value
    const mutasi = grid.slice(h + 1).map((r, i) => ({ i, tgl: keTanggal(r[iT]), ket: String(r[iK] || ''), jumlah: keAngka(r[iC]) }))
      .filter(m => m.tgl && m.jumlah > 0)
    const b = banks[+document.getElementById('rek').value]
    const noRek = String(b.accountNumber).replace(/\s+/g, '')
    const bln = document.getElementById('bulan').value
    const snap = await getDocs(query(collection(db, 'pembayaran'), where('tgl', '>=', bln + '-01'), where('tgl', '<=', bln + '-31')))
    const bankKey = 'transfer_' + String(b.bankName).toLowerCase().replace(/\s+/g, '_')
    const bayar = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(p => (p.rekeningNo === noRek) || (!p.rekeningNo && p.metode === bankKey))
      .filter(p => Number(p.jumlah) > 0)
    // Cocokkan: jumlah sama persis, tanggal terdekat (maks 3 hari)
    const dipakai = new Set(), cocok = [], tanpaMutasi = []
    bayar.sort((a, c) => a.tgl.localeCompare(c.tgl)).forEach(p => {
      const kand = mutasi.filter(m => !dipakai.has(m.i) && Math.round(m.jumlah) === Math.round(Number(p.jumlah)) && selisihHari(m.tgl, p.tgl) <= 3)
        .sort((x, y) => selisihHari(x.tgl, p.tgl) - selisihHari(y.tgl, p.tgl))
      if (kand.length) { dipakai.add(kand[0].i); cocok.push({ p, m: kand[0] }) } else tanpaMutasi.push(p)
    })
    const bulanMutasi = mutasi.filter(m => m.tgl.startsWith(bln))
    const tanpaCatatan = bulanMutasi.filter(m => !dipakai.has(m.i))
    hasil = { cocok, tanpaMutasi, tanpaCatatan, b, bln, totalMutasi: bulanMutasi.reduce((t, m) => t + m.jumlah, 0), totalBayar: bayar.reduce((t, p) => t + Number(p.jumlah), 0) }
    render()
  }

  window.pilihTab = t => { tab = t; render() }
  function render() {
    const h = hasil; if (!h) return
    const jml = a => a.reduce((t, x) => t + (Number(x.jumlah ?? x.p?.jumlah) || 0), 0)
    const div = d => DIVISION_META[d]?.label || d || ''
    const tabel = {
      cocok: `<table class="cm"><thead><tr><th>Tgl catat</th><th>Tgl bank</th><th>Order</th><th>Customer</th><th>Keterangan bank</th><th class="r">Jumlah</th></tr></thead><tbody>${h.cocok.map(({ p, m }) => `<tr><td>${esc(p.tgl)}</td><td>${esc(m.tgl)}</td><td><a href="order.html?id=${esc(p.orderId)}" style="color:var(--green);font-weight:700;text-decoration:none">${esc(p.orderNumber)}</a></td><td>${esc(p.customerName)}</td><td style="font-size:11px">${esc(m.ket)}</td><td class="r">${rp(p.jumlah)}</td></tr>`).join('')}</tbody></table>`,
      tanpaMutasi: `<table class="cm"><thead><tr><th>Tgl</th><th>Order</th><th>Customer</th><th>Divisi</th><th>Dicatat oleh</th><th class="r">Jumlah</th></tr></thead><tbody>${h.tanpaMutasi.map(p => `<tr><td>${esc(p.tgl)}</td><td><a href="order.html?id=${esc(p.orderId)}" style="color:var(--green);font-weight:700;text-decoration:none">${esc(p.orderNumber)}</a></td><td>${esc(p.customerName)}</td><td>${esc(div(p.division))}</td><td>${esc(p.olehNama || '')} · ${esc(p.lokasiNama || '')}</td><td class="r">${rp(p.jumlah)}</td></tr>`).join('')}</tbody></table>`,
      tanpaCatatan: `<table class="cm"><thead><tr><th>Tgl bank</th><th>Keterangan bank</th><th class="r">Jumlah</th></tr></thead><tbody>${h.tanpaCatatan.map(m => `<tr><td>${esc(m.tgl)}</td><td style="font-size:11px">${esc(m.ket)}</td><td class="r">${rp(m.jumlah)}</td></tr>`).join('')}</tbody></table>`,
    }
    const pilih = tab === 'beda' ? (h.tanpaMutasi.length ? 'tanpaMutasi' : 'tanpaCatatan') : tab
    document.getElementById('hasil').innerHTML = `
      <div class="cm-kartu">
        <div class="cm-k"><div class="l">Uang masuk di bank (bulan ini)</div><div class="v">${rp(h.totalMutasi)}</div></div>
        <div class="cm-k"><div class="l">Dicatat CS ke rekening ini</div><div class="v">${rp(h.totalBayar)}</div></div>
        <div class="cm-k"><div class="l">✅ Cocok</div><div class="v" style="color:#059669">${h.cocok.length} · ${rp(jml(h.cocok.map(x => x.p)))}</div></div>
        <div class="cm-k"><div class="l">⚠ Dicatat, tidak ada di bank</div><div class="v" style="color:#b91c1c">${h.tanpaMutasi.length} · ${rp(jml(h.tanpaMutasi))}</div></div>
        <div class="cm-k"><div class="l">❓ Masuk bank, tidak dicatat</div><div class="v" style="color:#b45309">${h.tanpaCatatan.length} · ${rp(jml(h.tanpaCatatan))}</div></div>
      </div>
      <div class="card">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          <button class="tab ${pilih === 'tanpaMutasi' ? 'on' : ''}" onclick="pilihTab('tanpaMutasi')">⚠ Dicatat, tidak ada di bank (${h.tanpaMutasi.length})</button>
          <button class="tab ${pilih === 'tanpaCatatan' ? 'on' : ''}" onclick="pilihTab('tanpaCatatan')">❓ Masuk bank, tidak dicatat (${h.tanpaCatatan.length})</button>
          <button class="tab ${pilih === 'cocok' ? 'on' : ''}" onclick="pilihTab('cocok')">✅ Cocok (${h.cocok.length})</button>
          <button class="btn btn-ghost btn-sm" onclick="unduh()">⬇ Excel</button>
        </div>
        <p style="font-size:11px;color:rgba(3,69,67,.5);margin-bottom:8px">${pilih === 'tanpaMutasi' ? 'Cek ke CS: mungkin salah pilih rekening, salah nominal, atau uang belum benar-benar masuk.' : pilih === 'tanpaCatatan' ? 'Uang masuk yang tidak ada di catatan Custom Order — bisa dari usaha lain (toko), QRIS gabungan, atau pembayaran yang lupa dicatat CS.' : 'Pembayaran yang dicatat CS dan benar-benar ada di mutasi bank.'}</p>
        <div class="cm-wrap">${tabel[pilih]}</div>
      </div>`
  }
  window.unduh = () => {
    const h = hasil
    const wb = XLSX.utils.book_new()
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(h.tanpaMutasi.map(p => ({ Tanggal: p.tgl, 'No. Order': p.orderNumber, Customer: p.customerName, 'Dicatat oleh': p.olehNama, Lokasi: p.lokasiNama, Jumlah: Number(p.jumlah) }))), 'Dicatat tdk di bank')
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(h.tanpaCatatan.map(m => ({ Tanggal: m.tgl, Keterangan: m.ket, Jumlah: m.jumlah }))), 'Di bank tdk dicatat')
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(h.cocok.map(({ p, m }) => ({ 'Tgl catat': p.tgl, 'Tgl bank': m.tgl, 'No. Order': p.orderNumber, Customer: p.customerName, Keterangan: m.ket, Jumlah: Number(p.jumlah) }))), 'Cocok')
    XLSX.writeFile(wb, `Cocok_Mutasi_${h.b.bankName}_${h.b.accountNumber}_${h.bln}.xlsx`)
  }
</script>
</body>
</html>

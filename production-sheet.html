<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#034543">
  <title>Papan Nama Sheet — Harmoni</title>
  <link rel="stylesheet" href="css/style.css?v=20261108a">
  <style>
    .sheet-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
    .sheet-tab { padding:7px 16px; border-radius:8px; border:1.5px solid rgba(3,69,67,.15); background:var(--white); font-size:13px; font-weight:600; cursor:pointer; color:rgba(3,69,67,.55); transition:all .15s; }
    .sheet-tab.active { background:var(--green); color:var(--beige); border-color:var(--green); }
    .ps-table { width:100%; border-collapse:collapse; font-size:13px; }
    .ps-table th { text-align:left; padding:8px 10px; font-size:10px; font-weight:700; color:rgba(3,69,67,.45); letter-spacing:.05em; border-bottom:2px solid rgba(3,69,67,.1); white-space:nowrap; background:var(--white); position:sticky; top:0; z-index:1; }
    .ps-table td { padding:10px 10px; border-bottom:1px solid rgba(3,69,67,.06); vertical-align:top; }
    .ps-table tr:hover td { background:rgba(3,69,67,.02); }
    .days-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
    .days-urgent { background:#fee2e2; color:#991b1b; }
    .days-warn { background:#fef3c7; color:#92400e; }
    .days-ok { background:#d1fae5; color:#065f46; }
    .days-done { background:rgba(3,69,67,.08); color:rgba(3,69,67,.4); }
    .status-select { border:1.5px solid rgba(3,69,67,.15); border-radius:7px; padding:4px 8px; font-size:12px; font-family:inherit; background:var(--white); color:var(--black); cursor:pointer; outline:none; }
    .status-select:focus { border-color:var(--green); }
    .file-mini { width:36px; height:36px; border-radius:6px; object-fit:cover; border:1px solid rgba(3,69,67,.1); display:inline-block; }
    .order-num { font-size:11px; font-weight:700; color:rgba(3,69,67,.4); letter-spacing:.03em; }
    .size-chips { display:flex; flex-wrap:wrap; gap:3px; }
    .size-chip { font-size:10px; background:rgba(3,69,67,.07); color:rgba(3,69,67,.7); padding:1px 5px; border-radius:4px; font-weight:600; }
    .pct-bar { height:4px; background:rgba(3,69,67,.08); border-radius:2px; margin-top:3px; width:80px; }
    .pct-fill { height:4px; background:var(--green); border-radius:2px; }
    .filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .filter-bar input, .filter-bar select { font-size:13px; padding:6px 10px; border:1.5px solid rgba(3,69,67,.15); border-radius:8px; background:var(--white); outline:none; font-family:inherit; }
    .filter-bar input:focus, .filter-bar select:focus { border-color:var(--green); }
    .dl-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap; }
    .dl-belum { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .dl-sudah { background:#ecfdf5; color:#047857; }
    .dl-berubah { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
    .dl-oleh { font-size:10px; color:rgba(3,69,67,.45); margin-top:2px; white-space:nowrap; }
    tr.row-belum td:first-child { box-shadow: inset 3px 0 0 #ef4444; }
    .dl-btn { font-size:12px; font-weight:700; padding:7px 12px; border-radius:8px; border:none; cursor:pointer; font-family:inherit; }
    .dl-btn-primary { background:var(--green); color:#fff; }
    .dl-btn-ghost { background:var(--white); color:var(--green); border:1.5px solid rgba(3,69,67,.2); }
    .saving-dot { display:none; width:8px; height:8px; border-radius:50%; background:#059669; animation:pulse .8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    @media(max-width:700px){
      .ps-table th:nth-child(5), .ps-table td:nth-child(5) { display:none; }
    }
  </style>
</head>
<body>
<div class="layout">
  <nav id="sidebar"></nav>
  <main class="main">
    <div style="margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-.025em;color:var(--black)">Papan Nama Sheet</h1>
        <p style="font-size:13px;color:rgba(3,69,67,.5);margin-top:2px">Order papan nama aktif — bordir & US/Kaca Lapis, update status langsung dari sini</p>
      </div>
      <span class="saving-dot" id="savingDot" title="Menyimpan…"></span>
    </div>

    <div class="sheet-tabs" id="sheetTabs"></div>

    <div class="filter-bar">
      <input type="search" id="searchInput" placeholder="Cari nama / no order…" style="flex:1;min-width:160px" oninput="applyFilter()">
      <select id="statusFilter" onchange="applyFilter()">
        <option value="">Semua Status</option>
        <option value="pending">Menunggu Konfirmasi</option>
        <option value="in-progress">Sedang Dikerjakan</option>
        <option value="quality-check">Quality Check</option>
      </select>
      <select id="urgentFilter" onchange="applyFilter()">
        <option value="">Semua</option>
        <option value="urgent">Urgent (≤ 2 hari)</option>
        <option value="warn">Hampir (≤ 5 hari)</option>
      </select>
      <select id="lokasiFilter" onchange="applyFilter()">
        <option value="">Semua Lokasi</option>
      </select>
      <select id="dlFilter" onchange="applyFilter()">
        <option value="">Semua Download</option>
        <option value="belum">⬇ Belum didownload</option>
        <option value="berubah">⚠ Berubah sejak download</option>
        <option value="sudah">✓ Sudah didownload</option>
      </select>
    </div>
    <div id="dlBar" style="display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>

    <div style="overflow-x:auto;border-radius:12px;border:1.5px solid rgba(3,69,67,.07)">
      <table class="ps-table" id="sheetTable">
        <thead>
          <tr>
            <th style="width:130px">NO ORDER</th>
            <th>NAMA / SPESIFIKASI</th>
            <th style="width:80px">FILE</th>
            <th style="width:80px;text-align:center">QTY</th>
            <th style="width:160px">UKURAN</th>
            <th style="width:110px;text-align:center">TARGET</th>
            <th style="width:100px;text-align:center">SISA</th>
            <th style="width:70px;text-align:center">PROG</th>
            <th style="width:160px">STATUS</th>
            <th style="width:130px">DOWNLOAD</th>
          </tr>
        </thead>
        <tbody id="sheetBody"><tr><td colspan="10" style="text-align:center;padding:32px;color:rgba(3,69,67,.35)">Pilih divisi di atas</td></tr></tbody>
      </table>
    </div>
    <div id="sheetCount" style="font-size:12px;color:rgba(3,69,67,.4);margin-top:8px;text-align:right"></div>
  </main>
</div>

<script type="module">
  import { db } from './js/config.js'
  import { requireAuth, dataAuthReady, getActiveDivisions, hasProductionAccess, canSeeOrder, csRangkapDivisi, divisiSaya } from './js/auth.js'
  import { collection, getDocs, doc, updateDoc, query, where, orderBy, Timestamp, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'
  import { STATUS_LABEL, fmtCurrency, fmtDate } from './js/utils.js'

  const SHEET_DIVISIONS = ['bordir', 'papan-nama']
  const DONE_STATUSES = ['done', 'delivered', 'cancelled']

  // Composite tabs: filter bordir to only orders with papan nama items.
  // papan-nama division is a straight query (no composite needed).
  const COMPOSITE_TABS = {
    'bordir': [
      { queryDiv: 'bordir', keyword: 'papan' }, // bordir orders with papan nama items only
    ]
  }

  let allOrders = []
  let filteredOrders = []
  let activeDiv = null
  let activeComposite = null  // array of { queryDiv, keyword } if composite tab
  let _profile = null

  // ── Download Excel per jenis (Bordir / US / KL): siapa yang mengunduh & apakah order berubah ──
  // Yang boleh mengunduh (dan tercatat): tim produksi, pemilik divisi, owner
  // + CS yang merangkap produksi Bordir / Papan Nama (diatur di Kelola Pengguna)
  const bolehDownload = () => ['production', 'divisi', 'owner'].includes(_profile?.role)
    || csRangkapDivisi(_profile).some(d => ['bordir', 'papan-nama'].includes(d))
  const JENIS_LABEL = { bordir: 'Bordir', us: 'US', kl: 'KL', lain: 'Lainnya' }

  // Jenis item papan nama dari nama/varian: KL (Kulit/Kaca Lapis) atau US; selain itu "lain"
  function jenisItem(it, o) {
    if (o.division === 'bordir') return 'bordir'
    const t = ` ${it?.name || ''} ${it?.varian || ''} `.toUpperCase()
    if (/\bKL\b|KULIT|LEATHER|KACA LAPIS/.test(t)) return 'kl'
    if (/\bUS\b|AKRILIK|AKRILIC/.test(t)) return 'us'
    return 'lain'
  }
  // Item order yang relevan untuk tab aktif (tab bordir: hanya item papan)
  function itemsTab(o) {
    const papanKeyword = activeComposite ? activeComposite.find(c => c.keyword)?.keyword : null
    return (papanKeyword && o.division !== activeDiv)
      ? (o.orderItems || []).filter(it => (it.name || '').toLowerCase().includes(papanKeyword))
      : (o.orderItems || [])
  }
  function itemsJenis(o, jenis) {
    const items = itemsTab(o)
    if (!items.length) return jenisItem({ name: o.varian || '' }, o) === jenis ? [{ name: o.varian || '', qty: o.qty }] : []
    return items.filter(it => jenisItem(it, o) === jenis)
  }
  const jenisOrder = o => ['bordir', 'us', 'kl', 'lain'].filter(j => itemsJenis(o, j).length)

  // Sidik isi yang relevan untuk produksi — beda sidik = order diubah setelah didownload
  function sidikOrder(o, jenis) {
    const isi = JSON.stringify([itemsJenis(o, jenis), o.sizeBreakdown || {}, o.notes || '', o.dueDate || '', o.designFiles || []])
    let h = 0
    for (let i = 0; i < isi.length; i++) h = (h * 31 + isi.charCodeAt(i)) | 0
    return String(h)
  }
  function statusDownload(o, jenis) {
    const dl = o.sheetDl?.[jenis]
    if (!dl?.at) return 'belum'
    return dl.sig && dl.sig !== sidikOrder(o, jenis) ? 'berubah' : 'sudah'
  }
  // Status gabungan satu order (yang terburuk dari semua jenisnya)
  function statusOrder(o) {
    const st = jenisOrder(o).map(j => statusDownload(o, j))
    return st.includes('belum') ? 'belum' : st.includes('berubah') ? 'berubah' : 'sudah'
  }
  const fmtWaktu = ts => {
    const d = ts?.toDate ? ts.toDate() : null
    return d ? d.toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''
  }
  const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  const STATUS_OPTIONS = [
    { value: 'pending',        label: '⏳ Menunggu Konfirmasi' },
    { value: 'in-progress',    label: '🔧 Sedang Dikerjakan' },
    { value: 'quality-check',  label: '🔍 Quality Check' },
    { value: 'done',           label: '✅ Selesai' },
    { value: 'delivered',      label: '📦 Sudah Dikirim' },
    { value: 'cancelled',      label: '❌ Dibatalkan' },
  ]

  requireAuth(async (profile) => {
    _profile = profile
    const canAccess = profile.role === 'owner' || profile.role === 'manager'
      || profile.role === 'cs' || hasProductionAccess(profile, null)
    if (!canAccess) {
      window.location.href = 'orders.html'
      return
    }
    await dataAuthReady
    const allDivs = await getActiveDivisions()

    // Build tabs — only sheet divisions that are active
    const sheetDivs = allDivs.filter(d => SHEET_DIVISIONS.includes(d.key))
    if (!sheetDivs.length) {
      document.getElementById('sheetTabs').innerHTML = '<p style="font-size:13px;color:rgba(3,69,67,.4)">Tidak ada divisi produksi yang aktif.</p>'
      return
    }

    // Restore last-used tab dari sessionStorage
    const savedFilters = restoreFilters()
    const savedDiv = savedFilters?.div && sheetDivs.some(d => d.key === savedFilters.div) ? savedFilters.div : sheetDivs[0].key
    const initialIdx = sheetDivs.findIndex(d => d.key === savedDiv)

    const tabEl = document.getElementById('sheetTabs')
    tabEl.innerHTML = sheetDivs.map((d, i) => `
      <button class="sheet-tab${i===initialIdx?' active':''}" onclick="switchDiv('${d.key}', this)">
        ${d.icon || '📦'} ${d.label}
      </button>`).join('')

    await switchDiv(savedDiv, tabEl.children[initialIdx])
  })

  window.switchDiv = async function(divKey, btnEl) {
    activeDiv = divKey
    activeComposite = COMPOSITE_TABS[divKey] || null
    document.querySelectorAll('.sheet-tab').forEach(b => b.classList.remove('active'))
    btnEl?.classList.add('active')
    document.getElementById('sheetBody').innerHTML = '<tr><td colspan="10" style="text-align:center;padding:28px;color:rgba(3,69,67,.35)">Memuat…</td></tr>'

    try {
      if (activeComposite) {
        // Pemilik Divisi hanya boleh membaca order divisinya sendiri (dikunci di Firestore Rules)
        const bolehDiv = d => _profile?.role !== 'divisi' || divisiSaya(_profile).includes(d)
        const snaps = await Promise.all(activeComposite.map(({ queryDiv }) =>
          bolehDiv(queryDiv) ? getDocs(query(collection(db, 'orders'), where('division', '==', queryDiv))) : Promise.resolve({ docs: [] })
        ))
        const seen = new Set()
        allOrders = []
        snaps.forEach((snap, idx) => {
          const { keyword } = activeComposite[idx]
          snap.docs.forEach(d => {
            if (seen.has(d.id)) return
            const o = { id: d.id, ...d.data() }
            if (DONE_STATUSES.includes(o.status)) return
            if (keyword) {
              const kw = keyword.toLowerCase()
              if (!(o.orderItems || []).some(it => (it.name || '').toLowerCase().includes(kw))) return
            }
            seen.add(d.id)
            allOrders.push(o)
          })
        })
      } else {
        const snap = (_profile?.role !== 'divisi' || divisiSaya(_profile).includes(divKey))
          ? await getDocs(query(collection(db, 'orders'), where('division', '==', divKey)))
          : { docs: [] }
        allOrders = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(o => !DONE_STATUSES.includes(o.status))
      }
      // Filter per-role — CS cabang/titik hanya lihat lokasinya
      allOrders = allOrders.filter(o => canSeeOrder(o, _profile))
      // Sort by dueDate ascending in JS (avoids composite Firestore index requirement)
      allOrders.sort((a, b) => (a.dueDate || '') < (b.dueDate || '') ? -1 : 1)
    } catch(e) {
      document.getElementById('sheetBody').innerHTML = `<tr><td colspan="10" style="text-align:center;padding:28px;color:#dc2626">Gagal memuat: ${e.message}</td></tr>`
      return
    }

    refreshLokasiFilter()
    // Restore lokasi filter setelah refreshLokasiFilter rebuild options
    try {
      const s = JSON.parse(sessionStorage.getItem(FILTER_KEY) || '{}')
      if (s.lokasi) document.getElementById('lokasiFilter').value = s.lokasi
    } catch {}
    applyFilter()
  }

  function refreshLokasiFilter() {
    const sel = document.getElementById('lokasiFilter')
    const current = sel.value
    const lokasis = [...new Set(allOrders.map(o => o.lokasiNama || 'Pusat').filter(Boolean))].sort()
    sel.innerHTML = '<option value="">Semua Lokasi</option>'
      + lokasis.map(l => `<option value="${l}"${l===current?' selected':''}>${l}</option>`).join('')
  }

  const FILTER_KEY = 'productionsheet_filters'
  function saveFilters() {
    try {
      sessionStorage.setItem(FILTER_KEY, JSON.stringify({
        div: activeDiv,
        q: document.getElementById('searchInput').value,
        status: document.getElementById('statusFilter').value,
        urgent: document.getElementById('urgentFilter').value,
        lokasi: document.getElementById('lokasiFilter').value,
        dl: document.getElementById('dlFilter').value,
      }))
    } catch {}
  }
  function restoreFilters() {
    try {
      const s = JSON.parse(sessionStorage.getItem(FILTER_KEY) || '{}')
      if (s.q) document.getElementById('searchInput').value = s.q
      if (s.status) document.getElementById('statusFilter').value = s.status
      if (s.urgent) document.getElementById('urgentFilter').value = s.urgent
      if (s.lokasi) document.getElementById('lokasiFilter').value = s.lokasi
      if (s.dl) document.getElementById('dlFilter').value = s.dl
      return s
    } catch { return {} }
  }

  window.applyFilter = function() {
    const search = document.getElementById('searchInput').value.toLowerCase()
    const statusF = document.getElementById('statusFilter').value
    const urgentF = document.getElementById('urgentFilter').value
    const lokasiF = document.getElementById('lokasiFilter').value
    const dlF = document.getElementById('dlFilter').value
    saveFilters()

    filteredOrders = allOrders.filter(o => {
      if (search && !((o.customerName||'').toLowerCase().includes(search) || (o.orderNumber||'').toLowerCase().includes(search))) return false
      if (statusF && o.status !== statusF) return false
      if (lokasiF && (o.lokasiNama || 'Pusat') !== lokasiF) return false
      if (dlF && statusOrder(o) !== dlF) return false
      if (urgentF) {
        const sisa = sisaHari(o.dueDate)
        if (urgentF === 'urgent' && (sisa === null || sisa > 2)) return false
        if (urgentF === 'warn' && (sisa === null || sisa > 5)) return false
      }
      return true
    })
    renderTable()
  }

  function sisaHari(dueDate) {
    if (!dueDate) return null
    return Math.ceil((new Date(dueDate) - new Date()) / 86400000)
  }

  function renderTable() {
    const tbody = document.getElementById('sheetBody')
    const bar = document.getElementById('dlBar')
    const jenisAda = ['bordir', 'us', 'kl', 'lain'].filter(j => allOrders.some(o => itemsJenis(o, j).length))
    bar.style.display = bolehDownload() && jenisAda.length ? 'flex' : 'none'
    bar.innerHTML = jenisAda.map(j => {
      const n = allOrders.filter(o => itemsJenis(o, j).length && statusDownload(o, j) !== 'sudah').length
      return `<span style="display:inline-flex;gap:4px;align-items:center">
        <button class="dl-btn dl-btn-primary" onclick="downloadSheet('${j}','baru')" ${n ? '' : 'disabled style="opacity:.45"'}>⬇ ${JENIS_LABEL[j]} — belum/berubah (${n})</button>
        <button class="dl-btn dl-btn-ghost" onclick="downloadSheet('${j}','tampil')" title="Download ulang semua ${JENIS_LABEL[j]} yang tampil">semua ${JENIS_LABEL[j]}</button>
      </span>`
    }).join('') + '<span style="font-size:11px;color:rgba(3,69,67,.45)">Setiap download dicatat nama pengunduhnya.</span>'
    document.getElementById('sheetCount').textContent = filteredOrders.length
      ? `${filteredOrders.length} order ditampilkan${allOrders.length !== filteredOrders.length ? ' (dari ' + allOrders.length + ' total)' : ''}`
      : ''

    if (!filteredOrders.length) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:rgba(3,69,67,.35)">
        ${allOrders.length ? 'Tidak ada order sesuai filter' : 'Tidak ada order aktif untuk divisi ini 🎉'}
      </td></tr>`
      return
    }

    tbody.innerHTML = filteredOrders.map((o, rowIdx) => {
      const sisa = sisaHari(o.dueDate)
      const isDone = DONE_STATUSES.includes(o.status)
      const sisaClass = isDone ? 'days-done' : sisa === null ? '' : sisa <= 2 ? 'days-urgent' : sisa <= 5 ? 'days-warn' : 'days-ok'
      const sisaText = isDone ? 'Selesai' : sisa === null ? '—' : sisa < 0 ? `${Math.abs(sisa)}h terlambat` : sisa === 0 ? 'Hari ini!' : `${sisa} hari`

      // Design files (first image only for thumbnail)
      const files = o.designFiles || []
      const firstImg = files.find(f => /\.(jpg|jpeg|png|gif|webp)/i.test(f.split('?')[0]))
      const fileCell = firstImg
        ? `<a href="${firstImg}" target="_blank"><img src="${firstImg}" class="file-mini" alt="file"></a>${files.length > 1 ? `<span style="font-size:10px;color:rgba(3,69,67,.4);margin-left:3px">+${files.length-1}</span>` : ''}`
        : files.length
          ? `<a href="${files[0]}" target="_blank" style="font-size:20px;text-decoration:none">📄</a>`
          : '<span style="color:rgba(3,69,67,.2);font-size:12px">—</span>'

      // Size breakdown
      const sizeEntries = o.sizeBreakdown ? Object.entries(o.sizeBreakdown).filter(([,v]) => v > 0) : []
      const sizeCell = sizeEntries.length
        ? `<div class="size-chips">${sizeEntries.map(([s,v]) => `<span class="size-chip">${s}:${v}</span>`).join('')}</div>`
        : '<span style="color:rgba(3,69,67,.25);font-size:12px">—</span>'

      // For composite tabs (papan-nama from bordir orders), only count papan-related items.
      // For direct papan-nama division orders, show all items.
      const papanKeyword = activeComposite ? activeComposite.find(c => c.keyword)?.keyword : null
      const relevantItems = (papanKeyword && o.division !== activeDiv)
        ? (o.orderItems || []).filter(it => (it.name || '').toLowerCase().includes(papanKeyword))
        : (o.orderItems || [])

      const totalQty = relevantItems.length
        ? relevantItems.reduce((s, it) => s + (it.qty || 0), 0)
        : sizeEntries.reduce((s, [, v]) => s + v, 0) || o.qty || '—'

      // Status select
      const statusOpts = STATUS_OPTIONS.map(opt =>
        `<option value="${opt.value}"${o.status===opt.value?' selected':''}>${opt.label}</option>`
      ).join('')

      const pct = o.progressPercentage || 0

      const dl = statusOrder(o)
      const dlCell = jenisOrder(o).map(j => {
        const st = statusDownload(o, j), info = o.sheetDl?.[j]
        const lbl = JENIS_LABEL[j]
        return st === 'belum'
          ? `<div><span class="dl-badge dl-belum">${lbl} ⬇ Belum</span></div>`
          : `<div><span class="dl-badge ${st === 'berubah' ? 'dl-berubah' : 'dl-sudah'}">${lbl} ${st === 'berubah' ? '⚠ Berubah' : '✓ Sudah'}</span>
             <div class="dl-oleh">${esc(info.by)} · ${fmtWaktu(info.at)}${(info.count || 0) > 1 ? ` · ${info.count}x` : ''}</div></div>`
      }).join('') || '<span style="color:rgba(3,69,67,.25);font-size:12px">—</span>'

      return `<tr id="row-${o.id}" class="${dl !== 'sudah' ? 'row-belum' : ''}">
        <td>
          <div class="order-num">${o.orderNumber || '—'}</div>
          <div style="font-size:10px;color:rgba(3,69,67,.3);margin-top:2px">${o.lokasiNama || 'Pusat'}</div>
        </td>
        <td>
          <div style="font-weight:600;color:var(--black)">${o.customerName || '—'}</div>
          ${relevantItems.length
            ? relevantItems.map(it =>
                `<div style="font-size:11px;color:rgba(3,69,67,.6);margin-top:2px">
                  ${it.name}${it.varian ? ` · ${it.varian}` : ''}${it.qty ? ` <span style="font-weight:700">(${it.qty})</span>` : ''}
                  ${it.namaCustom ? (() => { const ns = String(it.namaCustom).split(/\n+/).filter(Boolean); return `<br><span style="color:#7c3aed;font-weight:600">🏷 ${ns.length > 1 ? ns.length + ' nama: ' : ''}${ns.join(' · ')}</span>` })() : (o.division === 'papan-nama' || /papan/i.test(it.name || '') ? '<br><span style="color:#b45309;font-size:10px">⚠ daftar nama belum diisi di order</span>' : '')}
                </div>`
              ).join('')
            : o.varian ? `<div style="font-size:11px;color:rgba(3,69,67,.5);margin-top:2px">${o.varian}</div>` : ''}
          ${o.notes ? (() => {
              const short = o.notes.length > 80
              const preview = short ? o.notes.substring(0, 80) + '…' : o.notes
              return `<div style="font-size:11px;color:rgba(3,69,67,.4);margin-top:2px;font-style:italic">
                <span id="notes-short-${o.id}">${preview}</span>
                <span id="notes-full-${o.id}" style="display:none">${o.notes.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>
                ${short ? `<button onclick="toggleNotes('${o.id}')" id="notes-btn-${o.id}" style="margin-left:4px;font-size:10px;color:var(--green);background:none;border:none;cursor:pointer;padding:0;font-style:normal;text-decoration:underline">Lihat semua</button>` : ''}
              </div>`
            })() : ''}
        </td>
        <td>${fileCell}</td>
        <td style="text-align:center;font-weight:700;font-size:15px">${totalQty}</td>
        <td>${sizeCell}</td>
        <td style="text-align:center;font-size:12px;color:rgba(3,69,67,.6)">${o.dueDate ? o.dueDate.split('-').reverse().join('/') : '—'}</td>
        <td style="text-align:center"><span class="days-badge ${sisaClass}">${sisaText}</span></td>
        <td style="text-align:center">
          <div style="font-size:11px;font-weight:700;color:var(--green)">${pct}%</div>
          <div class="pct-bar"><div class="pct-fill" style="width:${pct}%"></div></div>
        </td>
        <td>
          <select class="status-select" onchange="updateStatus('${o.id}', this.value, ${rowIdx})">
            ${statusOpts}
          </select>
        </td>
        <td>${dlCell}</td>
      </tr>`
    }).join('')
  }

  function muatXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX)
    return new Promise((res, rej) => {
      const sc = document.createElement('script')
      sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
      sc.onload = () => res(window.XLSX)
      sc.onerror = () => rej(new Error('Library Excel gagal dimuat'))
      document.head.appendChild(sc)
    })
  }

  // Satu file Excel per jenis. mode 'baru' = yang belum/berubah, 'tampil' = semua yang tampil (sesuai filter)
  window.downloadSheet = async function(jenis, mode) {
    if (!bolehDownload()) return
    const sumber = mode === 'baru' ? allOrders : filteredOrders
    const rows = sumber.filter(o => itemsJenis(o, jenis).length && (mode !== 'baru' || statusDownload(o, jenis) !== 'sudah'))
    if (!rows.length) { alert(`Tidak ada order ${JENIS_LABEL[jenis]} untuk didownload.`); return }
    const dot = document.getElementById('savingDot')
    dot.style.display = 'inline-block'
    try {
      const XLSX = await muatXlsx()
      const data = rows.map(o => {
        const items = itemsJenis(o, jenis)
        const ukuran = o.sizeBreakdown ? Object.entries(o.sizeBreakdown).filter(([, v]) => v > 0).map(([k, v]) => `${k}:${v}`).join(', ') : ''
        const st = statusDownload(o, jenis)
        return {
          'No Order': o.orderNumber || '',
          'Pelanggan': o.customerName || '',
          'Item': items.map(it => `${it.name || ''}${it.varian ? ' · ' + it.varian : ''}${it.qty ? ' (' + it.qty + ')' : ''}`).join('\n'),
          'Nama Custom': items.map(it => it.namaCustom).filter(Boolean).join('\n'),
          'Qty': items.reduce((t, it) => t + (Number(it.qty) || 0), 0) || '',
          'Ukuran': ukuran,
          'Target': o.dueDate || '',
          'Lokasi': o.lokasiNama || 'Pusat',
          'Status': STATUS_LABEL[o.status] || o.status || '',
          'Catatan': o.notes || '',
          'File Desain': (o.designFiles || []).join('\n'),
          'Status Download': st === 'berubah' ? 'DIUBAH sejak download sebelumnya' : st === 'belum' ? 'Baru' : 'Pernah didownload',
        }
      })
      const ws = XLSX.utils.json_to_sheet(data)
      ws['!cols'] = [14, 22, 34, 22, 6, 18, 11, 12, 16, 30, 40, 22].map(w => ({ wch: w }))
      const wb = XLSX.utils.book_new()
      XLSX.utils.book_append_sheet(wb, ws, `Papan ${JENIS_LABEL[jenis]}`)
      // Sheet "Daftar Nama": satu baris per nama (untuk dikerjakan satu per satu)
      const baris = []
      rows.forEach(o => itemsJenis(o, jenis).forEach(it => {
        const ns = String(it.namaCustom || '').split(/\n+/).map(x => x.trim()).filter(Boolean)
        const per = ns.length && Number(it.qty) && Number(it.qty) % ns.length === 0 ? Number(it.qty) / ns.length : ''
        ns.forEach((n, i) => baris.push({ 'No Order': o.orderNumber || '', 'Pelanggan': o.customerName || '', 'Item': it.name || '', 'Varian': it.varian || '', 'No': i + 1, 'Nama': n, 'Qty per nama': per, 'Target': o.dueDate || '', 'Lokasi': o.lokasiNama || 'Pusat' }))
      }))
      if (baris.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(baris), 'Daftar Nama')
      const tgl = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '')
      XLSX.writeFile(wb, `PapanNama_${JENIS_LABEL[jenis]}_${tgl}.xlsx`)

      // Catat siapa yang mengunduh per order & per jenis — tanggung jawab produksi
      const now = Timestamp.now()
      const oleh = { by: _profile?.name || '', uid: _profile?.id || '' }
      for (let i = 0; i < rows.length; i += 400) {
        const batch = writeBatch(db)
        rows.slice(i, i + 400).forEach(o => batch.update(doc(db, 'orders', o.id), {
          [`sheetDl.${jenis}`]: { at: now, ...oleh, sig: sidikOrder(o, jenis), count: (o.sheetDl?.[jenis]?.count || 0) + 1 },
        }))
        await batch.commit()
      }
      rows.forEach(o => {
        o.sheetDl = { ...(o.sheetDl || {}), [jenis]: { at: now, ...oleh, sig: sidikOrder(o, jenis), count: (o.sheetDl?.[jenis]?.count || 0) + 1 } }
      })
      applyFilter()
    } catch (e) {
      alert('Gagal download: ' + e.message)
    } finally {
      dot.style.display = 'none'
    }
  }

  window.toggleNotes = function(orderId) {
    const short = document.getElementById(`notes-short-${orderId}`)
    const full  = document.getElementById(`notes-full-${orderId}`)
    const btn   = document.getElementById(`notes-btn-${orderId}`)
    if (!short || !full || !btn) return
    const expanded = full.style.display !== 'none'
    short.style.display = expanded ? '' : 'none'
    full.style.display  = expanded ? 'none' : ''
    btn.textContent = expanded ? 'Lihat semua' : 'Sembunyikan'
  }

  window.updateStatus = async function(orderId, newStatus, rowIdx) {
    const dot = document.getElementById('savingDot')
    dot.style.display = 'inline-block'
    try {
      await updateDoc(doc(db, 'orders', orderId), {
        status: newStatus,
        updatedAt: Timestamp.now(),
        lastEditBy: _profile?.name || 'production',
      })
      const o = allOrders.find(x => x.id === orderId)
      if (o) o.status = newStatus
      // Remove from list if now done
      if (DONE_STATUSES.includes(newStatus)) {
        allOrders = allOrders.filter(x => x.id !== orderId)
        applyFilter()
      }
    } catch(e) {
      alert('Gagal update status: ' + e.message)
    } finally {
      dot.style.display = 'none'
    }
  }
</script>

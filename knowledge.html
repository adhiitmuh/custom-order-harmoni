<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#034543">
  <title>Product Knowledge — Harmoni</title>
  <link rel="stylesheet" href="css/style.css?v=20261108a">
  <style>
    .price-table { table-layout:fixed; width:max-content; min-width:100%; border-collapse:collapse; font-size:13px; }
    .price-table th { position:relative; text-align:left; padding:8px 6px; font-size:10px; font-weight:700; letter-spacing:.05em; color:rgba(3,69,67,.45); border-bottom:2px solid rgba(3,69,67,.1); white-space:nowrap; overflow:hidden; user-select:none; }
    .price-table th:first-child { padding-left:10px; }
    .price-table td { padding:9px 6px; border-bottom:1px solid rgba(3,69,67,.06); color:var(--black); vertical-align:middle; white-space:nowrap; overflow:hidden; }
    .price-table td:first-child { white-space:normal; padding-left:10px; }
    .price-table tr:last-child td { border-bottom:none; }
    /* HP: tiap baris jadi kartu — semua kolom terlihat dengan labelnya */
    @media (max-width:640px) {
      .price-table { width:100% !important; table-layout:auto; }
      .price-table thead { display:none; }
      .price-table, .price-table tbody { display:block; }
      .price-table tr { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px 8px; padding:10px 8px; border-bottom:1px solid rgba(3,69,67,.1); }
      .price-table td { display:block; padding:0 !important; border:none !important; white-space:normal; overflow:visible; min-width:0; width:auto !important; }
      .price-table td[data-label]::before { content:attr(data-label); display:block; font-size:9px; font-weight:700; letter-spacing:.05em; color:rgba(3,69,67,.45); margin-bottom:2px; }
      .price-table td.kol-nama, .price-table td.kol-lebar, .price-table td[colspan] { grid-column:1 / -1; }
      .price-table td:empty { display:none; }
      .price-table td input { width:100% !important; max-width:none !important; font-size:15px; }
      .price-table td.kol-aksi { grid-column:1 / -1; text-align:right; }
      .price-table tr[style*="border-bottom:none"] { border-bottom:none; padding-bottom:0; }
    }
    .price-table tr:hover td { background:rgba(3,69,67,.02); }
    .col-resize { position:absolute; right:0; top:0; width:6px; height:100%; cursor:col-resize; z-index:2; background:transparent; border-radius:3px; transition:background .15s; }
    .col-resize:hover, .col-resize.active { background:rgba(3,69,67,.25); }
    .tier-normal { font-weight:700; color:#059669; }
    .tier-cabang { font-weight:700; color:#0369a1; }
    .price-table input[placeholder="Nama produk"], .price-table input[placeholder="Nama varian"], #priceRows input[id^="price-name-"] { text-transform:uppercase; }
    .price-table input:disabled, #priceRows input:disabled { opacity:.55; background:rgba(3,69,67,.04); cursor:not-allowed; }
    .tier-promo  { font-weight:700; color:#d97706; }
    .tier-admin  { font-weight:700; color:#b91c1c; }
    .tier-badge { display:inline-flex; align-items:center; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:700; margin-left:4px; }
    .tb-normal { background:#dcfce7; color:#166534; }
    .tb-promo  { background:#fef3c7; color:#92400e; }
    .tb-admin  { background:#fee2e2; color:#991b1b; }
    .tier-modal { font-weight:700; color:#7c3aed; }
    .drag-handle-icon { cursor:grab; color:rgba(3,69,67,.2); font-size:14px; vertical-align:middle; margin-right:4px; display:inline-block; user-select:none; }
    .drag-handle-icon:hover { color:rgba(3,69,67,.5); }
    .price-table tr.drag-over > td { background:rgba(3,69,67,.07) !important; outline:1px dashed rgba(3,69,67,.25); }
    .price-table tr.drag-dragging { opacity:0.35; }
    .tb-modal  { background:#ede9fe; color:#4c1d95; }
    .inp-inline {
      border: none; background: transparent; font-size: 13px;
      font-weight: inherit; color: inherit; width: 100%; outline: none;
      padding: 2px 0; cursor: pointer;
      border-bottom: 1.5px dashed transparent; transition: border-color .15s;
    }
    .inp-inline:hover { border-bottom-color: rgba(3,69,67,.25); }
    .inp-inline:focus { border-bottom-color: currentColor; cursor: text; }
    .inp-inline::placeholder { color: rgba(3,69,67,.2); font-weight: 400; }
    .inp-inline[type=number]::-webkit-inner-spin-button,
    .inp-inline[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .inp-inline[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
<div class="layout">
  <nav id="sidebar"></nav>
  <main class="main">
    <div style="margin-bottom:20px">
      <p style="font-size:11px;color:var(--green);opacity:.4;letter-spacing:.06em;margin-bottom:4px">REFERENSI</p>
      <h1 style="font-size:24px;font-weight:800;letter-spacing:-.025em;color:var(--black)" id="pageTitle">Product Knowledge</h1>
      <div id="usulanPanel"></div>
    </div>

    <!-- Division tabs -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px" id="divTabs"></div>

    <div id="knowledgeContent"><div class="loading">Memuat…</div></div>
  </main>
</div>

<!-- Edit content modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--white);border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:80vh;overflow-y:auto">
    <h3 style="font-size:15px;font-weight:700;margin-bottom:16px" id="modalTitle">Edit Konten</h3>
    <div class="form-group"><label>Judul</label><input type="text" id="modalTitleInput"></div>
    <div class="form-group">
      <label>Konten</label>
      <p style="font-size:11px;color:rgba(3,69,67,.4);margin-bottom:6px">Gunakan **teks** untuk tebal, baris baru untuk paragraf baru</p>
      <textarea id="modalContent" rows="12" style="font-family:monospace;font-size:13px"></textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center">Batal</button>
      <button onclick="saveSection()" class="btn btn-primary" style="flex:1;justify-content:center" id="modalSaveBtn">Simpan</button>
    </div>
  </div>
</div>

<!-- Price list modal -->
<div id="priceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--white);border-radius:16px;padding:24px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto">
    <h3 style="font-size:15px;font-weight:700;margin-bottom:16px" id="priceModalTitle">Edit Daftar Harga</h3>
    <div id="priceRows" style="margin-bottom:14px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="closePriceModal()" class="btn btn-ghost" style="flex:1;justify-content:center">Batal</button>
      <button onclick="saveSingleItem()" class="btn btn-primary" style="flex:1;justify-content:center" id="priceSaveBtn">Simpan</button>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './js/config.js'
  import { requireAuth, getProfile, dataAuthReady, getActiveDivisions } from './js/auth.js'
  import { collection, query, where, getDocs, doc, setDoc, addDoc, deleteDoc, getDoc, updateDoc, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'
  import { DIVISION_META, DIVISIONS } from './js/utils.js'
  import { simpanDaftarHarga, bolehKelolaHarga, bolehIsiHarga, bolehHapusItem, keteranganIzin, roleHarga, cariMirip, kunciNama, rapikanItem, hargaPublik } from './js/hargaList.js?v=20261109b'

  // Kunci kolom harga sesuai role (aturan sama dengan Worker /price-list-save)
  const _prof = () => getProfile()
  let _divKonteks = ''  // divisi daftar harga yang sedang dirender/diedit (untuk izin pengisi per divisi)
  const kunci = (k, lama, baru) => bolehIsiHarga(_prof(), k, lama, baru, _divKonteks) ? '' : ` disabled title="Diisi ${k === 'priceAdmin' ? 'Owner' : k === 'pricePromo' ? 'Kepala Cabang / Owner' : k === 'priceModal' ? 'Owner / Pemilik Divisi' : 'Kepala Cabang / Owner (harga sudah terisi)'}"`
  const kunciTeks = (it, k) => (_prof()?.role === 'cs' && it?._tersimpan && it[k] && !it.baru) ? ' disabled title="Diubah Kepala Cabang / Owner"' : ''
  // Ganti nama: Owner selalu; pengisi daftar harga (izin divisi) hanya untuk item/varian yang masih 🆕 BARU
  const kunciNamaItem = (it, induk) => (!bolehHapusItem(_prof()) && it && it._tersimpan
    && !(roleHarga(_prof(), _divKonteks) === 'pengisi' && (it.baru || induk?.baru))) ? ' disabled title="Ganti nama item hanya Owner (atau pengisi selama item masih BARU)"' : ''
  const tandai = items => (items || []).forEach(it => { it._tersimpan = true; (it.variants || []).forEach(v => { v._tersimpan = true }) })
  const lencanaBaru = (d, i, it) => it?.baru ? `<span title="Item baru dari ${String(it.dibuatOleh || 'staf').replace(/"/g, '')} — belum dicek Owner" style="font-size:9px;font-weight:800;background:#e0f2fe;color:#0369a1;border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap">🆕 BARU</span>${_prof()?.role === 'owner' ? `<button onclick="verifikasiItem('${d}',${i})" title="Tandai sudah dicek" style="border:none;background:none;cursor:pointer;font-size:11px;color:#059669;font-weight:800">✓ cek</button>` : ''}` : ''
  function tampilkanDitolak(ditolak) {
    if (!ditolak?.length) return
    showSavedToast(`⚠ ${ditolak.length} perubahan tidak disimpan: ${ditolak[0]}${ditolak.length > 1 ? ' …' : ''}`, '#d97706')
    console.warn('Perubahan ditolak:', ditolak)
  }

  const params = new URLSearchParams(location.search)
  let activeDiv = params.get('div') || ''
  let editingDocId = null
  let editingPriceDiv = null
  let editingItemIndex = -1
  let sections = []
  const contentCache = {}
  let priceDataStore = {}
  let _inlineSaveTimers = {}
  let _savedToast = null
  requireAuth(async (profile) => {
    // Izin khusus pengisi daftar harga (diatur Owner per orang per divisi)
    try {
      await dataAuthReady
      const iz = await getDoc(doc(db, 'settings', 'izin_harga'))
      window._izinHarga = iz.exists() ? (iz.data().map || {}) : {}
      profile.izinHarga = window._izinHarga[profile.id]?.divisions || []
    } catch { profile.izinHarga = [] }
    if (profile.role === 'owner') {
      document.getElementById('pageTitle').insertAdjacentHTML('afterend', `<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="bukaIzinHarga()">👥 Izin isi daftar harga</button>`)
    }
    await renderTabs(profile)
    loadContent(profile)
    muatUsulan()
  })

  // ── Usulan perubahan harga dari pengisi daftar harga → disetujui/ditolak Owner ──
  const LABEL_KOLOM = { priceNormal: 'Normal', priceCabang: 'Cabang', pricePromo: 'Promo', priceAdmin: 'Admin', priceModal: 'Modal', unit: 'Satuan', note: 'Keterangan' }
  const fmtNilai = (k, v) => k.startsWith('price') ? 'Rp' + (Number(v) || 0).toLocaleString('id-ID') : (v || '—')
  let _usulan = []
  async function muatUsulan() {
    const prof = getProfile(), el = document.getElementById('usulanPanel'); if (!el || !prof) return
    try {
      const q = prof.role === 'owner' ? query(collection(db, 'price_list_usulan'), where('status', '==', 'menunggu'))
        : query(collection(db, 'price_list_usulan'), where('olehUid', '==', prof.id))
      const snap = await getDocs(q)
      _usulan = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => prof.role === 'owner' || u.status === 'menunggu')
    } catch { _usulan = [] }
    if (!_usulan.length) { el.innerHTML = ''; return }
    const isOwner = prof.role === 'owner'
    el.innerHTML = `<div style="margin-top:12px;border:1.5px solid #fde68a;background:#fffbeb;border-radius:12px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <b style="color:#b45309">⏳ ${isOwner ? 'Usulan perubahan harga menunggu persetujuan Anda' : 'Usulan Anda menunggu persetujuan Owner'} (${_usulan.length})</b>
        ${isOwner ? `<div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="putusUsulan('semua','setuju')">✓ Setujui semua</button></div>` : ''}
      </div>
      ${_usulan.map(u => `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid #fde68a;padding:7px 0;font-size:13px">
        <div><b>${escAttr(u.label)}</b> <span style="color:rgba(3,69,67,.5);font-size:11px">${escAttr(DIVISION_META[u.division]?.label || u.division)}</span><br>
          ${LABEL_KOLOM[u.kolom] || u.kolom}: <s style="color:rgba(3,69,67,.45)">${escAttr(fmtNilai(u.kolom, u.dari))}</s> → <b>${escAttr(fmtNilai(u.kolom, u.ke))}</b>
          <span style="font-size:11px;color:rgba(3,69,67,.5)"> · ${escAttr(u.oleh || '')}</span></div>
        ${isOwner ? `<div style="display:flex;gap:6px;align-items:center"><button class="btn btn-primary btn-sm" onclick="putusUsulan('${u.id}','setuju')">✓ Setujui</button><button class="btn btn-ghost btn-sm" onclick="putusUsulan('${u.id}','tolak')">✕ Tolak</button></div>` : '<span style="font-size:11px;color:#b45309">menunggu</span>'}
      </div>`).join('')}</div>`
  }
  window.putusUsulan = async function(id, aksi) {
    const daftar = id === 'semua' ? _usulan : _usulan.filter(u => u.id === id)
    if (!daftar.length) return
    if (id === 'semua' && !confirm(`Setujui ${daftar.length} perubahan harga?`)) return
    try {
      if (aksi === 'setuju') {
        // Terapkan per divisi ke daftar harga terbaru, lalu simpan sebagai Owner
        const perDiv = {}
        daftar.forEach(u => { (perDiv[u.division] = perDiv[u.division] || []).push(u) })
        for (const [div, us] of Object.entries(perDiv)) {
          const snap = await getDoc(doc(db, 'price_list', div))
          const items = snap.exists() ? (snap.data().items || []) : []
          us.forEach(u => {
            const it = items.find(x => kunciNama(x.name) === kunciNama(u.item)); if (!it) return
            const target = u.varian ? (it.variants || []).find(v => kunciNama(v.name) === kunciNama(u.varian)) : it
            if (target) target[u.kolom] = u.kolom.startsWith('price') ? Number(u.ke) || 0 : u.ke
          })
          const hasil = await simpanDaftarHarga(getProfile(), div, items)
          if (priceDataStore[div]) { tandai(hasil.items); priceDataStore[div].items = hasil.items; rerenderPriceWrap(div) }
        }
      }
      for (const u of daftar) await updateDoc(doc(db, 'price_list_usulan', u.id), { status: aksi === 'setuju' ? 'disetujui' : 'ditolak', diputusOleh: getProfile()?.name || 'Owner', diputusAt: Timestamp.now() })
      showSavedToast(aksi === 'setuju' ? `✓ ${daftar.length} perubahan disetujui & berlaku` : 'Usulan ditolak')
      muatUsulan()
    } catch (e) { alert('Gagal: ' + e.message) }
  }

  window.bukaIzinHarga = async function() {
    const { loadStaff } = await import('./js/mentions.js')
    const staf = (await loadStaff()).filter(u => u.role !== 'owner')
    const map = window._izinHarga || {}
    const divs = (await getActiveDivisions()).map(d => d.key ? d : { key: d })
    document.getElementById('izinModal')?.remove()
    const m = document.createElement('div'); m.id = 'izinModal'
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px'
    m.innerHTML = `<div style="background:#fff;border-radius:16px;max-width:560px;width:100%;padding:18px;max-height:88vh;overflow:auto">
      <div style="font-weight:800;font-size:15px;margin-bottom:4px">👥 Izin isi daftar harga</div>
      <p style="font-size:12px;color:rgba(3,69,67,.55);margin-bottom:10px">Orang yang dicentang bisa menambah item & mengisi harga <b>Normal, Cabang, Promo, Modal</b> di divisi itu. Harga Admin, hapus & ganti nama item tetap hanya Owner.</p>
      <input type="search" id="izCari" placeholder="Cari nama…" style="margin-bottom:8px">
      <div id="izList">${staf.map(u => `<div class="izRow" data-nama="${escAttr(u.name.toLowerCase())}" style="border-top:1px solid rgba(3,69,67,.08);padding:8px 0">
        <div style="font-weight:700;font-size:13px">${escAttr(u.name)} <span style="font-weight:400;color:rgba(3,69,67,.45);font-size:11px">${escAttr(u.role || '')}</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px">${divs.map(d => `<label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" data-uid="${escAttr(u.id)}" data-nama="${escAttr(u.name)}" value="${escAttr(d.key)}" ${(map[u.id]?.divisions || []).includes(d.key) ? 'checked' : ''}>${escAttr((DIVISION_META[d.key]?.icon || '') + ' ' + (DIVISION_META[d.key]?.label || d.label || d.key))}</label>`).join('')}</div></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost" style="flex:1" onclick="document.getElementById('izinModal').remove()">Batal</button><button class="btn btn-primary" style="flex:1" onclick="simpanIzinHarga()">Simpan</button></div></div>`
    document.body.appendChild(m)
    m.querySelector('#izCari').oninput = e => { const q = e.target.value.toLowerCase(); m.querySelectorAll('.izRow').forEach(r => { r.style.display = r.dataset.nama.includes(q) ? '' : 'none' }) }
  }
  window.simpanIzinHarga = async function() {
    const map = {}
    document.querySelectorAll('#izinModal input[type=checkbox]:checked').forEach(c => { (map[c.dataset.uid] = map[c.dataset.uid] || { nama: c.dataset.nama, divisions: [] }).divisions.push(c.value) })
    try {
      await setDoc(doc(db, 'settings', 'izin_harga'), { map, updatedAt: Timestamp.now() })
      window._izinHarga = map; document.getElementById('izinModal').remove()
      showSavedToast(`✓ Izin disimpan (${Object.keys(map).length} orang)`)
    } catch (e) { alert('Gagal menyimpan: ' + e.message) }
  }

  async function renderTabs(profile) {
    const el = document.getElementById('divTabs')
    el.innerHTML = ''
    const allBtn = document.createElement('a')
    allBtn.href = 'knowledge.html'
    allBtn.className = `btn btn-sm ${!activeDiv ? 'btn-primary' : 'btn-ghost'}`
    allBtn.textContent = '📖 Semua'
    allBtn.onclick = (e) => { e.preventDefault(); activeDiv = ''; history.pushState(null,'','knowledge.html'); renderTabs(profile); loadContent(profile) }
    el.appendChild(allBtn)
    const divs = await getActiveDivisions()
    divs.forEach(d => {
      const btn = document.createElement('a')
      btn.href = `knowledge.html?div=${d.key}`
      btn.className = `btn btn-sm ${activeDiv === d.key ? 'btn-primary' : 'btn-ghost'}`
      btn.innerHTML = `${d.icon} ${d.label}`
      btn.onclick = (e) => { e.preventDefault(); activeDiv = d.key; history.pushState(null,'',`knowledge.html?div=${d.key}`); renderTabs(profile); loadContent(profile) }
      el.appendChild(btn)
    })
  }

  async function loadContent(profile) {
    const el = document.getElementById('knowledgeContent')
    const cacheKey = activeDiv || '__all__'
    const activeDivs = await getActiveDivisions()
    const divsToShow = activeDiv ? [activeDiv] : activeDivs.map(d => d.key)
    // Show cached content immediately — fetch fresh in background
    if (contentCache[cacheKey]) {
      el.innerHTML = contentCache[cacheKey]
      divsToShow.forEach(d => rerenderPriceWrap(d))
    } else {
      el.innerHTML = '<div class="loading">Memuat…</div>'
    }
    const canEdit = DIVISIONS.some(d => bolehKelolaHarga(profile, d))
    const canEditModal = profile.role === 'owner' || profile.role === 'data' || profile.role === 'divisi' || (profile.izinHarga || []).length > 0

    try {
      await dataAuthReady
      // Fetch all knowledge (no orderBy to avoid composite index requirement)
      const snap = await getDocs(query(collection(db,'product_knowledge'), where('division','in', divsToShow.slice(0,30))))
      let allSections = snap.docs.map(x => ({ id: x.id, ...x.data() }))
      allSections.sort((a,b) => (a.orderIndex||0) - (b.orderIndex||0))
      sections = allSections

      // Fetch price lists — semua parallel
      const priceData = {}
      await Promise.all(divsToShow.map(async d => {
        const pSnap = await getDoc(doc(db,'price_list',d))
        if (pSnap.exists()) priceData[d] = pSnap.data()
      }))
      // Owner: nama item & varian lama → HURUF KAPITAL (sekali jalan; data yang sudah kapital tidak disentuh)
      if (getProfile()?.role === 'owner') {
        await Promise.all(Object.entries(priceData).map(async ([d, data]) => {
          const items = data.items || []
          const perlu = items.some(it => (it.name || '') !== String(it.name || '').toUpperCase()
            || (it.variants || []).some(v => (v.name || '') !== String(v.name || '').toUpperCase()))
          if (!perlu) return
          try {
            const hasil = await simpanDaftarHarga(getProfile(), d, items)

          const tSrc = data.updatedAt?.toMillis?.() || (data.updatedAt instanceof Date ? data.updatedAt.getTime() : 0)
          if (tPub < tSrc || tPub === -1) await setDoc(doc(db, 'price_list_public', d), { division: d, items: hargaPublik(data.items || []), updatedAt: Timestamp.now() })

      divsToShow.forEach(d => {

      el.innerHTML = rendered

  window.saveSingleItem = async function() {
    const btn = document.getElementById('priceSaveBtn')
    const edited = window._priceItems?.[0]
    if (!edited?.name?.trim()) { alert('Nama item harus diisi'); return }
    const newItem = rapikanItem({ ...edited, name: edited.name.trim() })
    // Cegah item dobel: nama sama / mirip dengan item lain di divisi ini
    const lain = priceDataStore[editingPriceDiv]?.items || []
    const mirip = cariMirip(newItem.name, lain, 0.72, editingItemIndex)
    if (mirip.some(m => kunciNama(m.it.name) === kunciNama(newItem.name))) { alert(`Item "${mirip[0].it.name}" sudah ada di daftar harga. Edit item itu saja (tambahkan sebagai varian kalau beda bahan/ukuran).`); return }
    if (mirip.length && !confirm(`Item ini mirip dengan yang sudah ada:\n\n${mirip.slice(0, 3).map(m => '• ' + m.it.name).join('\n')}\n\nKalau barangnya sama, batalkan lalu pakai/edit item itu (atau tambah varian). Tetap simpan sebagai item baru?`)) return
    if (!priceDataStore[editingPriceDiv]) priceDataStore[editingPriceDiv] = { items: [] }
    const items = [...(priceDataStore[editingPriceDiv].items || [])]
    if (editingItemIndex >= 0) {
      items[editingItemIndex] = newItem
    } else {
      items.push(newItem)
    }
    btn.disabled = true; btn.textContent = 'Menyimpan…'
    try {
      const hasil = await simpanDaftarHarga(getProfile(), editingPriceDiv, items)
      tandai(hasil.items)
      priceDataStore[editingPriceDiv].items = hasil.items
      tampilkanDitolak(hasil.ditolak)

      delete contentCache['__all__']
      rerenderPriceWrap(editingPriceDiv)
      if (!hasil.ditolak.length) showSavedToast(`✓ Item "${newItem.name}" tersimpan`)
    } catch (err) { alert('Gagal menyimpan: ' + err.message) } finally { btn.disabled = false; btn.textContent = 'Simpan' }
  }

  window.savePriceList = async function() {
    const btn = document.getElementById('priceSaveBtn')
    const items = (window._priceItems||[]).map(rapikanItem).filter(item => item.name)
    const names = items.map(it => it.name.trim().toLowerCase())
    const dupes = names.filter((n, i) => names.indexOf(n) !== i)
    if (dupes.length) {
      alert(`Ada nama item duplikat: "${dupes[0]}". Harap perbaiki sebelum menyimpan.`)
      return
    }
    btn.disabled=true; btn.textContent='Menyimpan…'
    try {
      const hasil = await simpanDaftarHarga(getProfile(), editingPriceDiv, items)
      tampilkanDitolak(hasil.ditolak)
      closePriceModal()
      delete contentCache[editingPriceDiv || '__all__']
      delete contentCache['__all__']
      await loadContent(getProfile())
    } finally { btn.disabled=false; btn.textContent='Simpan' }
  }

  // === INLINE PRICE EDITING ===
  function escAttr(str) {
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;')

  function fmtPrice(n) {
    const num = Number(String(n||'').replace(/\./g,''))
    return num > 0 ? num.toLocaleString('id-ID') : ''
  }
  window.fmtInputPrice = function(val) {
    const digits = String(val).replace(/\D/g,'')
    return digits ? Number(digits).toLocaleString('id-ID') : ''
  }

          <td><input class="inp-inline tier-normal" type="text" inputmode="numeric" value="${fmtPrice(p.priceNormal)}"${kunci('priceNormal', p.priceNormal, p.baru)} oninput="this.value=fmtInputPrice(this.value)" onchange="updateInlinePrice('${d}',${i},'priceNormal',this.value)" placeholder="0"></td>

      const itemRow = canEdit ? `<tr data-item-index="${i}" draggable="true" style="border-bottom:none">

        <td><input class="inp-inline" type="text" value="${escAttr(p.unit||'')}"${kunciTeks(p, 'unit')} onchange="updateInlinePrice('${d}',${i},'unit',this.value)" placeholder="—" style="color:rgba(3,69,67,.5);max-width:70px"></td>
        <td style="white-space:normal"><input class="inp-inline" type="text" value="${escAttr(p.note||'')}"${kunciTeks(p, 'note')} onchange="updateInlinePrice('${d}',${i},'note',this.value)" placeholder="—" style="color:rgba(3,69,67,.45);font-size:12px"></td>

          ${bisaHapus || !p._tersimpan ? `<button onclick="removeInlinePriceRow('${d}',${i})" style="background:none;border:none;cursor:pointer;color:rgba(3,69,67,.3);font-size:14px;padding:2px 4px" title="Hapus baris">✕</button>` : ''}

      </tr>` : `<tr style="background:rgba(3,69,67,.02);border-bottom:none">
        <td style="font-weight:700;white-space:normal">${escAttr(p.name||'')}</td>
        <td style="font-size:11px;color:rgba(3,69,67,.4);font-style:italic;white-space:nowrap">${p.variants.length} varian</td>
        <td colspan="${priceColCount}" style="font-size:11px;color:rgba(3,69,67,.3);text-align:center;font-style:italic">—</td>

        <td style="color:rgba(3,69,67,.4);font-size:12px;white-space:normal">${escAttr(p.note||'—')}</td>
      </tr>`

      const variantRows = p.variants.map((v, vi) => canEdit ? `<tr style="background:rgba(3,69,67,.012)">
        <td style="padding-left:16px;border-left:2px solid rgba(3,69,67,.08)"></td>
        <td style="white-space:normal"><input class="inp-inline" type="text" value="${escAttr(v.name||'')}"${kunciNamaItem(v, p)} onchange="updateInlineVariant('${d}',${i},${vi},'name',this.value)" placeholder="Nama varian" style="font-size:12px;color:rgba(3,69,67,.75);font-weight:500;white-space:normal"></td>
        <td><input class="inp-inline tier-normal" type="text" inputmode="numeric" value="${fmtPrice(v.priceNormal)}"${kunci('priceNormal', v.priceNormal, v.baru)} oninput="this.value=fmtInputPrice(this.value)" onchange="updateInlineVariant('${d}',${i},${vi},'priceNormal',this.value)" placeholder="0"></td>
        <td><input class="inp-inline tier-cabang" type="text" inputmode="numeric" value="${fmtPrice(v.priceCabang)}"${kunci('priceCabang', v.priceCabang, v.baru)} oninput="this.value=fmtInputPrice(this.value)" onchange="updateInlineVariant('${d}',${i},${vi},'priceCabang',this.value)" placeholder="0"></td>
        <td><input class="inp-inline tier-promo" type="text" inputmode="numeric" value="${fmtPrice(v.pricePromo)}"${kunci('pricePromo', v.pricePromo, v.baru)} oninput="this.value=fmtInputPrice(this.value)" onchange="updateInlineVariant('${d}',${i},${vi},'pricePromo',this.value)" placeholder="0"></td>
        <td><input class="inp-inline tier-admin" type="text" inputmode="numeric" value="${fmtPrice(v.priceAdmin)}"${kunci('priceAdmin', v.priceAdmin, v.baru)} oninput="this.value=fmtInputPrice(this.value)" onchange="updateInlineVariant('${d}',${i},${vi},'priceAdmin',this.value)" placeholder="0"></td>
        ${canEditModal ? `<td><input class="inp-inline tier-modal" type="text" inputmode="numeric" value="${fmtPrice(v.priceModal)}"${kunci('priceModal', v.priceModal, v.baru)} oninput="this.value=fmtInputPrice(this.value)" onchange="updateInlineVariant('${d}',${i},${vi},'priceModal',this.value)" placeholder="0"></td>` : ''}
        <td></td><td></td>
        <td>${bisaHapus || !v._tersimpan ? `<button onclick="removeInlineVariant('${d}',${i},${vi})" style="background:none;border:none;cursor:pointer;color:rgba(3,69,67,.25);font-size:13px;padding:2px 4px" title="Hapus varian">✕</button>` : ''}</td>

        <td style="padding-left:16px;border-left:2px solid rgba(3,69,67,.08)"></td>
        <td style="font-size:12px;color:rgba(3,69,67,.7);font-weight:500;white-space:normal">${escAttr(v.name||'')}</td>
        <td class="tier-normal">${v.priceNormal ? Number(v.priceNormal).toLocaleString('id-ID') : '—'}</td>
        <td class="tier-cabang">${v.priceCabang ? Number(v.priceCabang).toLocaleString('id-ID') : '—'}</td>
        <td class="tier-promo">${v.pricePromo ? Number(v.pricePromo).toLocaleString('id-ID') : '—'}</td>
        <td class="tier-admin">${v.priceAdmin ? Number(v.priceAdmin).toLocaleString('id-ID') : '—'}</td>
        ${canEditModal ? `<td class="tier-modal">${v.priceModal ? Number(v.priceModal).toLocaleString('id-ID') : '—'}</td>` : ''}
        <td></td><td></td>
      </tr>`)

      const addVariantBtn = canEdit ? [`<tr style="border-bottom:none"><td></td><td colspan="${totalCols-1}" style="padding:2px 6px 8px">
        <button onclick="addInlineVariant('${d}',${i})" style="background:none;border:none;cursor:pointer;font-size:11px;color:rgba(3,69,67,.4);padding:0">+ tambah varian</button>
      </td></tr>`] : []

      return [itemRow, ...variantRows, ...addVariantBtn]
    }).join('')

    return `<div style="overflow-x:auto"><table class="price-table">
      <thead><tr>
        <th style="width:200px;min-width:80px">LAYANAN / PRODUK</th>
        <th style="width:90px;min-width:55px">VARIAN</th>
        <th style="width:85px;min-width:55px">NORMAL</th>
        <th style="width:85px;min-width:55px" title="Harga di cabang/titik (Normal + ongkos transport/operasional cabang)">CABANG</th>
        <th style="width:85px;min-width:55px">PROMO</th>
        <th style="width:85px;min-width:55px">ADMIN</th>
        ${canEditModal ? '<th style="width:85px;min-width:55px">MODAL</th>' : ''}
        <th style="width:70px;min-width:45px">SATUAN</th>
        <th style="width:150px;min-width:70px">KETERANGAN</th>
        ${canEdit ? '<th style="width:58px;min-width:42px"></th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${canEdit ? `<button onclick="addInlinePriceRow('${d}')" class="btn btn-ghost btn-sm" style="margin-top:8px">＋ Tambah Baris</button>` : ''}`
  }

  // ── Upah jahit per pcs (Jersey/Tailor) — data internal terpisah: upah_jahit/{divisi} ──
  // Dipakai form penjahit di detail order: pilih item → upah = pcs × upah per pcs.
  const _upahCache = {}
  const kunciUpah = (nama, varian) => [nama, varian].filter(Boolean).join(' · ')
  async function rerenderUpahWrap(division) {
    const el = document.getElementById(`upah-wrap-${division}`); if (!el) return
    if (!_upahCache[division]) {
      try { const sn = await getDoc(doc(db, 'upah_jahit', division)); _upahCache[division] = sn.exists() ? (sn.data().items || {}) : {} }
      catch { _upahCache[division] = {} }
    }
    const upah = _upahCache[division]
    const bolehUbah = ['owner', 'data'].includes(getProfile()?.role)
    const kunci = (priceDataStore[division]?.items || []).flatMap(it =>
      it.variants?.length ? it.variants.filter(v => v.name).map(v => kunciUpah(it.name, v.name)) : [kunciUpah(it.name)]).filter(Boolean)
    const escA = t => String(t ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')
    el.innerHTML = `<div style="border-top:1px dashed rgba(3,69,67,.15);padding-top:12px">
      <h3 style="font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:4px">🧵 Upah Jahit per pcs — Internal</h3>
      <p style="font-size:11px;color:rgba(3,69,67,.45);margin-bottom:8px">Dipakai otomatis saat CS memilih item di bagian Penjahit pada order: upah = jumlah pcs × upah per pcs. Tidak terlihat customer.</p>
      ${kunci.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px">${kunci.map(k => `
        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:6px 10px;font-size:12px">
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escA(k)}">${escA(k)}</span>
          ${bolehUbah
            ? `<input type="text" inputmode="numeric" value="${upah[k] ? Number(upah[k]).toLocaleString('id-ID') : ''}" placeholder="Rp/pcs" data-kunci="${escA(k)}" oninput="this.value=fmtInputPrice(this.value)" onchange="simpanUpahJahit('${division}', this)" style="width:96px;font-size:12px;padding:4px 6px;text-align:right">`
            : `<b>${upah[k] ? 'Rp' + Number(upah[k]).toLocaleString('id-ID') : '—'}</b>`}
        </label>`).join('')}</div>` : '<p style="font-size:12px;color:rgba(3,69,67,.35)">Tambahkan item di daftar harga dulu.</p>'}
    </div>`
  }
  window.simpanUpahJahit = async function(division, input) {
    const k = input.dataset.kunci
    const nilai = parseInt(String(input.value).replace(/\D/g, '')) || 0
    const items = { ...(_upahCache[division] || {}) }
    if (nilai) items[k] = nilai; else delete items[k]
    try {
      await setDoc(doc(db, 'upah_jahit', division), { division, items, updatedAt: Timestamp.now(), updatedBy: getProfile()?.name || '' })
      _upahCache[division] = items
      showSavedToast(`✓ Upah ${k} tersimpan`)
    } catch (err) { alert('Gagal simpan upah: ' + err.message) }
  }

  function rerenderPriceWrap(division) {
    rerenderUpahWrap(division)
    const el = document.getElementById(`price-wrap-${division}`)
    if (!el) return
    el.innerHTML = renderInlinePriceTable(division)
    const tbl = el.querySelector('.price-table')
    labelKolom(tbl)
    initResizableTable(tbl)
    initDragSort(tbl, division)
  }

  // Label kolom di tiap sel (dipakai tampilan kartu di HP)
  function labelKolom(tbl) {
    if (!tbl) return
    const judul = [...tbl.querySelectorAll('thead th')].map(th => th.textContent.trim())
    tbl.querySelectorAll('tbody tr').forEach(tr => {
      let kol = 0
      ;[...tr.children].forEach(td => {
        const span = Number(td.getAttribute('colspan') || 1)
        const j = judul[kol] || ''
        if (span === 1 && j && td.textContent.trim() !== '' || (span === 1 && j && td.querySelector('input'))) td.dataset.label = j
        if (kol === 0) td.classList.add('kol-nama')
        if (/KETERANGAN/i.test(j)) td.classList.add('kol-lebar')
        if (kol === judul.length - 1 && !j) td.classList.add('kol-aksi')
        kol += span
      })
    })
  }

  function initDragSort(tbl, division) {
    if (!tbl) return
    let dragSrcIdx = null
    tbl.querySelectorAll('tr[data-item-index]').forEach(tr => {
      tr.addEventListener('dragstart', e => {
        dragSrcIdx = parseInt(tr.dataset.itemIndex)
        e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', String(dragSrcIdx))
        setTimeout(() => tr.classList.add('drag-dragging'), 0)
      })
      tr.addEventListener('dragend', () => {
        tr.classList.remove('drag-dragging')
        tbl.querySelectorAll('tr.drag-over').forEach(r => r.classList.remove('drag-over'))
        dragSrcIdx = null
      })
      tr.addEventListener('dragover', e => {
        e.preventDefault()
        e.dataTransfer.dropEffect = 'move'
        const toIdx = parseInt(tr.dataset.itemIndex)
        if (toIdx === dragSrcIdx) return
        tbl.querySelectorAll('tr.drag-over').forEach(r => r.classList.remove('drag-over'))
        tr.classList.add('drag-over')
      })
      tr.addEventListener('drop', async e => {
        e.preventDefault()
        e.stopPropagation()
        const toIdx = parseInt(tr.dataset.itemIndex)
        if (dragSrcIdx == null || dragSrcIdx === toIdx) return
        const items = priceDataStore[division]?.items
        if (!items) return
        const [moved] = items.splice(dragSrcIdx, 1)
        items.splice(toIdx, 0, moved)
        rerenderPriceWrap(division)
        try {
          const hasil = await simpanDaftarHarga(getProfile(), division, items)
          tampilkanDitolak(hasil.ditolak)
        } catch(err) { console.error(err); showSavedToast('⚠ Gagal menyimpan urutan: ' + err.message, '#b91c1c') }
      })
    })
  }

  function initResizableTable(tbl) {
    if (!tbl) return
    tbl.querySelectorAll('thead th').forEach(th => {
      const h = document.createElement('div')
      h.className = 'col-resize'
      h.title = 'Seret untuk ubah lebar kolom'
      th.appendChild(h)
      let x0, w0
      h.addEventListener('mousedown', e => {
        x0 = e.clientX; w0 = th.offsetWidth
        h.classList.add('active')
        e.preventDefault(); e.stopPropagation()
        const mv = e => {
          const minW = parseInt(th.style.minWidth) || 40
          th.style.width = Math.max(minW, w0 + e.clientX - x0) + 'px'
        }
        const up = () => {
          h.classList.remove('active')
          document.removeEventListener('mousemove', mv)
          document.removeEventListener('mouseup', up)
        }
        document.addEventListener('mousemove', mv)
        document.addEventListener('mouseup', up)
      })
    })
  }

  window.verifikasiItem = function(division, index) {
    const it = priceDataStore[division]?.items?.[index]; if (!it) return
    it.baru = false; (it.variants || []).forEach(v => { v.baru = false })
    it.dicekOleh = getProfile()?.name || 'Owner'
    rerenderPriceWrap(division); scheduleInlineSave(division)
  }
  window.updateInlinePrice = function(division, index, field, value) {
    const item = priceDataStore[division]?.items?.[index]
    if (!item) return
    if (field === 'name' && String(value).trim()) {
      const mirip = cariMirip(value, priceDataStore[division].items, 0.72, index)
      if (mirip.some(m => kunciNama(m.it.name) === kunciNama(value))) {
        alert(`"${mirip[0].it.name}" sudah ada di daftar harga — tidak perlu dibuat lagi.`); rerenderPriceWrap(division); return
      }
      if (mirip.length && !confirm(`"${value}" mirip dengan:\n${mirip.slice(0, 3).map(m => '• ' + m.it.name).join('\n')}\n\nKalau barangnya sama, batalkan dan pakai item itu (atau tambahkan varian). Tetap buat item baru?`)) { rerenderPriceWrap(division); return }
    }
    // Ganti nama item tersimpan → kirim nama asal supaya server mengganti (bukan membuat item baru)
    if (field === 'name' && item._tersimpan && !item.namaLama && item.name !== value) item.namaLama = item.name
    item[field] = _priceFields.includes(field) ? Number(String(value).replace(/\./g,''))||0 : value
    scheduleInlineSave(division)
  }

  function scheduleInlineSave(division) {
    clearTimeout(_inlineSaveTimers[division])
    _inlineSaveTimers[division] = setTimeout(() => flushInlineSave(division), 1000)
  }

  async function flushInlineSave(division) {
    delete _inlineSaveTimers[division]
    // Masih mengetik di tabel ini → tunda; simpan setelah keluar dari kolom
    const wrap = document.getElementById(`price-wrap-${division}`)
    if (wrap && wrap.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') {
      const el = document.activeElement
      el.addEventListener('blur', () => scheduleInlineSave(division), { once: true })
      return
    }
    const items = (priceDataStore[division]?.items || []).map(rapikanItem).filter(item => item.name)
    const names = items.map(it => it.name.toLowerCase())
    if (names.some((n, i) => names.indexOf(n) !== i)) {
      showSavedToast('⚠ Ada nama duplikat — perbaiki sebelum data tersimpan', '#d97706')
      return
    }
    try {
      const hasil = await simpanDaftarHarga(getProfile(), division, items)
      delete contentCache[division]
      delete contentCache['__all__']
      // Pakai versi yang benar-benar tersimpan (kolom yang tidak diizinkan dikembalikan)
      if (hasil.ditolak.length || hasil.usulan) {
        // Ada yang ditolak / jadi usulan → tampilkan versi tersimpan, tapi baris/varian yang belum bernama tetap dipertahankan
        const kosong = (priceDataStore[division].items || []).filter(it => !String(it.name || '').trim())
        const lokal = new Map((priceDataStore[division].items || []).map(it => [kunciNama(it.name), it]))
        hasil.items.forEach(it => { const l = lokal.get(kunciNama(it.name)); const vKosong = (l?.variants || []).filter(v => !String(v.name || '').trim()); if (vKosong.length) it.variants = [...(it.variants || []), ...vKosong] })
        tandai(hasil.items); priceDataStore[division].items = [...hasil.items, ...kosong]; rerenderPriceWrap(division)
      } else {
        // Tersimpan semua → jangan bangun ulang tabel (kolom yang sedang diisi tidak terputus)
        const baru = new Map(hasil.items.map(it => [kunciNama(it.name), it]))
        ;(priceDataStore[division].items || []).forEach(it => { const b = baru.get(kunciNama(it.name)); if (b && it.name) { it._tersimpan = true; delete it.namaLama; (it.variants || []).forEach(v => { delete v.namaLama; if (v.name) v._tersimpan = true }); if (b.baru) { it.baru = true; it.dibuatOleh = b.dibuatOleh } } })
      }
      if (hasil.usulan) { showSavedToast(`⏳ ${hasil.usulan} perubahan dikirim ke Owner — berlaku setelah disetujui`, '#b45309'); muatUsulan() }
      else if (hasil.ditolak.length) tampilkanDitolak(hasil.ditolak); else showSavedToast()
    } catch(err) { console.error('Gagal simpan harga:', err); showSavedToast('⚠ Gagal menyimpan: ' + err.message, '#b91c1c') }
  }

  window.addInlinePriceRow = function(division) {
    if (!priceDataStore[division]) priceDataStore[division] = { items: [] }
    priceDataStore[division].items.push({ name:'', priceNormal:0, priceCabang:0, pricePromo:0, priceAdmin:0, priceModal:0, unit:'', note:'', variants:[] })
    rerenderPriceWrap(division)
    setTimeout(() => {
      const tr = document.querySelector(`#price-wrap-${division} tbody tr:last-child`)
      tr?.querySelector('input')?.focus()
    }, 50)
  }

  window.removeInlinePriceRow = function(division, index) {
    if (!priceDataStore[division]?.items) return
    priceDataStore[division].items.splice(index, 1)
    rerenderPriceWrap(division)
    scheduleInlineSave(division)
  }

  window.updateInlineVariant = function(division, itemIdx, varIdx, field, value) {
    const item = priceDataStore[division]?.items?.[itemIdx]
    if (!item?.variants?.[varIdx]) return
    const v = item.variants[varIdx]
    if (field === 'name' && v._tersimpan && !v.namaLama && v.name !== value) v.namaLama = v.name
    item.variants[varIdx][field] = _priceFields.includes(field) ? Number(String(value).replace(/\./g,''))||0 : value
    scheduleInlineSave(division)
  }

  window.removeInlineVariant = function(division, itemIdx, varIdx) {
    const item = priceDataStore[division]?.items?.[itemIdx]
    if (!item?.variants) return
    item.variants.splice(varIdx, 1)
    rerenderPriceWrap(division)
    scheduleInlineSave(division)
  }

  window.addInlineVariant = function(division, itemIdx) {
    const item = priceDataStore[division]?.items?.[itemIdx]
    if (!item) return
    if (!item.variants) item.variants = []
    item.variants.push({ name: '', priceNormal: 0, priceCabang: 0, pricePromo: 0, priceAdmin: 0, priceModal: 0 })
    rerenderPriceWrap(division)
    // Fokus ke nama varian baru; disimpan setelah namanya diisi (tidak langsung)
    setTimeout(() => { const ins = document.querySelectorAll(`#price-wrap-${division} input[placeholder="Nama varian"]`); [...ins].reverse().find(x => !x.value)?.focus() }, 50)
  }

  function showSavedToast(msg = '✓ Harga tersimpan', color = '#059669') {
    if (_savedToast) _savedToast.remove()
    const el = document.createElement('div')
    el.style.cssText = `position:fixed;bottom:24px;right:24px;background:${color};color:white;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none`
    el.textContent = msg
    document.body.appendChild(el)
    _savedToast = el
    setTimeout(() => { el.remove(); if (_savedToast === el) _savedToast = null }, 2500)
  }

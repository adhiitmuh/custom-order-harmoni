<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#034543">
  <title>Kelola Pengguna — Harmoni</title>
  <link rel="stylesheet" href="css/style.css?v=20261108a">
</head>
<body>
<div class="layout">
  <nav id="sidebar"></nav>
  <main class="main">
    <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px">
      <span style="font-size:20px;flex-shrink:0">⚠️</span>
      <div>
        <div style="font-weight:700;font-size:13px;color:#92400e;margin-bottom:3px">Tambah & hapus akun via Portal</div>
        <div style="font-size:12px;color:#b45309">Registrasi dan hapus akun dilakukan di <a href="https://adhiitmuh.github.io/harmoni-indonesia/" target="_blank" style="color:#92400e;font-weight:700">Portal Harmoni →</a>. Assign lokasi dan divisi bisa langsung di sini.</div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px">
      <div>
        <p style="font-size:11px;color:var(--green);opacity:.4;letter-spacing:.06em;margin-bottom:4px">REFERENSI</p>
        <h1 style="font-size:24px;font-weight:800;letter-spacing:-.025em;color:var(--black)">Kelola Pengguna</h1>
      </div>
    </div>

    <div id="error" class="alert alert-error" style="display:none"></div>
    <div id="success" class="alert alert-success" style="display:none"></div>

    <!-- User list -->
    <div id="userList"><div class="loading">Memuat…</div></div>
  </main>
</div>

<!-- Modal Edit Lokasi -->
<div id="lokasiModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="width:100%;max-width:400px;margin:0">
    <h2 style="font-size:15px;font-weight:700;margin-bottom:16px">📍 Atur Lokasi Pengguna</h2>
    <div class="form-group" style="margin-bottom:20px">
      <label>Lokasi</label>
      <select id="editLokasiSel" style="width:100%"></select>
      <p class="form-hint">CS dan manager hanya melihat order dari lokasi yang dipilih</p>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="closeLokasiModal()" class="btn btn-ghost" style="flex:1;justify-content:center">Batal</button>
      <button onclick="saveLokasi()" class="btn btn-primary" style="flex:1;justify-content:center" id="saveLokasiBtn">Simpan</button>
    </div>
  </div>
</div>

<script type="module">
  const escH = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
  import { auth, db, authDb } from './js/config.js'
  import { requireAuth, getProfile } from './js/auth.js'
  import { collection, getDocs, doc, setDoc, deleteDoc, updateDoc, Timestamp, query, orderBy, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'
  import { DIVISIONS, DIVISION_META } from './js/utils.js'

  const ROLE_LABEL = { owner: 'Owner', manager: 'Kepala Cabang', cs: 'CS', production: 'Tim Produksi', data: 'Data Entry', divisi: 'Pemilik Divisi' }

  let lokasiOptions = []

  async function loadLokasiOptions() {
    try {
      const snap = await getDocs(collection(db, 'lokasi'))
      lokasiOptions = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(l => l.aktif !== false)
        .sort((a, b) => (a.tipe || '').localeCompare(b.tipe || ''))
    } catch(e) { console.warn('loadLokasiOptions:', e.message) }
  }


  requireAuth(async (profile) => {
    if (profile.role !== 'owner') { window.location.href = 'dashboard.html'; return }
    loadLokasiOptions()
    loadUsers()
  })

  async function loadUsers() {
    const el = document.getElementById('userList')
    let snap
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout — coba refresh halaman')), 10000))
      snap = await Promise.race([getDocs(collection(db,'users')), timeout])
    } catch(e) {
      el.innerHTML = `<div style="padding:20px;color:#dc2626;font-size:13px">⚠️ Gagal memuat: ${e.message}</div>`
      return
    }
    // Akun Portal yang punya akses Custom Order — supaya staf baru langsung muncul
    // (dan bisa diberi lokasi) walaupun belum pernah login ke Custom Order
    let portal = []
    try {
      const ps = await getDocs(query(collection(authDb, 'users'), where('apps.custom_order.akses', '==', true)))
      portal = ps.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.aktif !== false)
    } catch (e) { console.warn('Gagal membaca akun Portal:', e.message) }

    const opById = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]))
    const gabung = portal.map(p => {
      const op = opById.get(p.id) || {}
      opById.delete(p.id)
      return { ...op, id: p.id, name: p.nama || op.name || p.email, email: p.email || op.email || '',
               role: p.apps?.custom_order?.role || op.role || 'cs',
               divisions: p.apps?.custom_order?.divisions || op.divisions,
               merangkapProduction: p.apps?.custom_order?.merangkapProduction || false,
               belumLogin: !op.email }
    })

    // Deduplicate by email — each user has 2 docs (portalUID + anonUID), keep one per email
    const seen = new Set(gabung.map(u => u.email).filter(Boolean))
    const users = [...gabung, ...[...opById.values()]
      .filter(u => { if (!u.email || seen.has(u.email)) return false; seen.add(u.email); return true })]
      .sort((a, b) => (a.role === 'owner') - (b.role === 'owner') || String(a.name).localeCompare(String(b.name)))

    if (!users.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><p>Belum ada pengguna</p></div>'
      return
    }

    el.innerHTML = users.map(u => `
      <div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:14px">
        <div class="avatar" style="width:40px;height:40px;font-size:16px;background:rgba(3,69,67,.1);color:var(--green)">${(u.name||'U')[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${escH(u.name||'—')}${u.belumLogin ? ' <span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:#fffbeb;color:#b45309">belum pernah login</span>' : ''}</div>
          <div style="font-size:12px;color:rgba(3,69,67,.5);font-family:monospace">${u.email||''}</div>
          ${u.lokasiNama ? `<div style="font-size:11px;color:rgba(3,69,67,.4);margin-top:1px">📍 ${u.lokasiNama}</div>` : (u.branch ? `<div style="font-size:11px;color:rgba(3,69,67,.4);margin-top:1px">📍 ${u.branch}</div>` : '')}
          ${u.role === 'divisi' && u.divisi ? `<div style="font-size:11px;color:rgba(3,69,67,.5);margin-top:1px">🏭 ${DIVISION_META[u.divisi]?.icon||''} ${DIVISION_META[u.divisi]?.label||u.divisi}</div>` : (() => { const dd = u.divisions?.length ? u.divisions : (u.division ? [u.division] : []); if (!dd.length) return ''; const prefix = u.merangkapProduction ? '+ Prod: ' : ''; return `<div style="font-size:11px;color:rgba(3,69,67,.5);margin-top:1px">${prefix}${dd.map(d=>`${DIVISION_META[d]?.icon||''} ${DIVISION_META[d]?.label||d}`).join(' · ')}</div>` })()}
        </div>
        <span class="badge badge-pill" style="background:rgba(3,69,67,.08);color:var(--green)">${ROLE_LABEL[u.role]||u.role}</span>
        ${u.id !== getProfile()?.id ? `
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            ${u.role !== 'owner' ? `<button onclick="editLokasi('${u.id}','${u.lokasiId||''}')" class="btn btn-ghost btn-sm">📍 Lokasi</button>` : ''}
            ${u.role === 'manager' ? `<button onclick="aturPin(this.dataset.id,this.dataset.nama)" data-id="${escH(u.id)}" data-nama="${escH(u.name)}" class="btn btn-ghost btn-sm">🔑 Atur PIN</button>` : ''}
            <button onclick="deleteUser(this.dataset.id,this.dataset.nama)" data-id="${escH(u.id)}" data-nama="${escH(u.name)}" class="btn btn-danger btn-sm">Hapus</button>
          </div>` : '<span style="font-size:11px;color:rgba(3,69,67,.3)">(Anda)</span>'}
      </div>`).join('')
  }

  // PIN approval Kepala Cabang: disimpan sebagai hash di server (pin_kepala), tidak bisa dibaca dari aplikasi
  window.aturPin = async (id, nama) => {
    const pin = prompt(`PIN approval baru untuk ${nama} (4–8 angka):`); if (pin === null) return
    if (!/^\d{4,8}$/.test(pin.trim())) { alert('PIN harus 4–8 angka'); return }
    try {
      const idToken = await auth.currentUser?.getIdToken()
      const res = await fetch('https://harmoni-order-api.adhiitmuh.workers.dev/set-pin', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` }, body: JSON.stringify({ managerId: id, pin: pin.trim(), nama }) })
      const d = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(d.error || res.status)
      alert(`✅ PIN ${nama} tersimpan. Beritahu langsung ke yang bersangkutan.`)
    } catch (e) { alert('Gagal menyimpan PIN: ' + e.message) }
  }

  let _editLokasiUid = null

  window.editLokasi = function(uid, currentLokasiId) {
    _editLokasiUid = uid
    const sel = document.getElementById('editLokasiSel')
    sel.innerHTML = '<option value="">— Tidak ditentukan (akses semua) —</option>'
    lokasiOptions.forEach(l => {
      const opt = document.createElement('option')
      opt.value = l.id
      const icon = l.tipe === 'pusat' ? '🏢' : l.tipe === 'cabang' ? '🏬' : '📍'
      opt.textContent = `${icon} ${l.nama}`
      if (l.id === currentLokasiId) opt.selected = true
      sel.appendChild(opt)
    })
    document.getElementById('lokasiModal').style.display = 'flex'
  }

  window.closeLokasiModal = function() {
    document.getElementById('lokasiModal').style.display = 'none'
    _editLokasiUid = null
  }

  window.saveLokasi = async function() {
    if (!_editLokasiUid) return
    const sel = document.getElementById('editLokasiSel')
    const lokasiId = sel.value
    const lokasiObj = lokasiId ? lokasiOptions.find(l => l.id === lokasiId) : null
    const lokasiNama = lokasiObj?.nama || ''
    const lokasiTipe = lokasiObj?.tipe || ''
    const btn = document.getElementById('saveLokasiBtn')
    btn.disabled = true; btn.textContent = 'Menyimpan…'
    try {
      // merge: staf yang belum pernah login belum punya dokumen di sini
      await setDoc(doc(db, 'users', _editLokasiUid), { lokasiId, lokasiNama, lokasiTipe }, { merge: true })
      closeLokasiModal()
      await loadUsers()
    } catch(err) {
      alert('Gagal simpan: ' + err.message)
    } finally { btn.disabled = false; btn.textContent = 'Simpan' }
  }

  window.deleteUser = async function(uid, name) {
    if (!confirm(`Hapus pengguna ${name}? Data Firestore-nya akan dihapus, tapi akun Firebase Auth-nya perlu dihapus manual di Firebase Console.`)) return
    try {
      await deleteDoc(doc(db,'users',uid))
      await loadUsers()
    } catch(err) {
      document.getElementById('error').textContent = err.message
      document.getElementById('error').style.display=''
    }
  }
</script>
</body>
</html>

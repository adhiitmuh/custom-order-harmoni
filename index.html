<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#034543">
  <title>Login — Harmoni Order System</title>
  <link rel="stylesheet" href="css/style.css?v=20261108a">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <img src="img/logo-green.png" alt="harmoni" style="height:40px;display:block;margin:0 auto 8px">
      <div style="font-size:10px;color:#034543;opacity:.4;letter-spacing:.1em;font-family:monospace">ORDER SYSTEM</div>
    </div>

    <div id="error" class="alert alert-error" style="display:none"></div>
    <div id="flash" class="alert" style="display:none;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@harmoni.id" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;justify-content:center" id="submitBtn">
        Masuk
      </button>
    </form>

    <p style="text-align:center;font-size:11px;color:rgba(3,69,67,.35);margin-top:20px">
      PT Citra Harmonis · Makassar
    </p>
  </div>
</div>

<script type="module">
  import { auth } from './js/config.js'
  import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'

  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'dashboard.html'
  })

  const flash = sessionStorage.getItem('flash_success')
  if (flash) {
    sessionStorage.removeItem('flash_success')
    const el = document.getElementById('flash')
    el.textContent = flash
    el.style.display = 'block'
  }

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault()
    const btn = document.getElementById('submitBtn')
    const errEl = document.getElementById('error')
    errEl.style.display = 'none'
    btn.disabled = true
    btn.textContent = 'Memproses...'

    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value

    try {
      // Sign in ke harmoni-indonesia (auth utama)
      await signInWithEmailAndPassword(auth, email, password)
      // Sesi project data (harmoni-custom-order) dibuat oleh js/auth.js lewat custom token
      window.location.href = 'dashboard.html'
    } catch (err) {
      const msgs = {
        'auth/user-not-found': 'Email tidak terdaftar',
        'auth/wrong-password': 'Password salah',
        'auth/invalid-email': 'Format email tidak valid',
        'auth/invalid-credential': 'Email atau password salah',
        'auth/too-many-requests': 'Terlalu banyak percobaan, coba lagi nanti',
      }
      errEl.textContent = msgs[err.code] || 'Login gagal, coba lagi'
      errEl.style.display = 'block'
    } finally {
      btn.disabled = false
      btn.textContent = 'Masuk'
    }
  })
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/custom-order-harmoni/sw.js').catch(() => {})
  }
</script>
</body>
</html>

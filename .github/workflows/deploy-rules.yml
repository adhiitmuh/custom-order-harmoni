name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Firestore & Storage rules
        run: npx firebase-tools deploy --only firestore:rules,storage --project harmoni-custom-order --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
